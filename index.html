<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Michell · Finance</title>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@300;400;500&family=DM+Sans:wght@300;400;500;600&display=swap" rel="stylesheet"/>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
<style>
/* ═══════════════════════════════════════════════════
   TOKENS
═══════════════════════════════════════════════════ */
:root {
  --ivory:       #F7F5F0;
  --ivory-card:  #FAFAF7;
  --ivory-deep:  #EEEBE3;
  --blue:        #7BAFD4;
  --blue-deep:   #4F8DB4;
  --blue-muted:  #D2E8F5;
  --gray-200:    #DDD9D0;
  --gray-400:    #A09890;
  --gray-600:    #6B6560;
  --gray-800:    #3A3530;
  --green:       #4F9B73;
  --green-light: #D4EDE2;
  --yellow:      #C8941A;
  --yellow-light:#FBF0D0;
  --red:         #C05050;
  --red-light:   #F5DADA;
  --sh-green:    #188038;
  --sh-bg:       #E6F4EA;

  /* Spreadsheet palette */
  --cell-bg:        #FFFFFF;
  --cell-border:    #E0E0E0;
  --cell-header-bg: #F8F9FA;
  --cell-header-txt:#444746;
  --cell-row-alt:   #FAFAFA;
  --cell-select:    rgba(26,115,232,.12);
  --cell-select-bd: #1A73E8;
  --cell-income:    #E6F4EA;
  --cell-expense:   #FCE8E6;
  --cell-savings:   #E8F0FE;

  --font-d: 'Cormorant Garamond', serif;
  --font-b: 'DM Sans', sans-serif;
  --t: .18s ease;
}

*, *::before, *::after { box-sizing:border-box; margin:0; padding:0; }
html { font-size:14px; }
body {
  font-family: var(--font-b);
  background: var(--ivory);
  color: var(--gray-800);
  min-height: 100vh;
  -webkit-font-smoothing: antialiased;
}

/* ═══════════════════════════════════════════════════
   SCROLLBAR
═══════════════════════════════════════════════════ */
::-webkit-scrollbar { width:6px; height:6px; }
::-webkit-scrollbar-track { background:transparent; }
::-webkit-scrollbar-thumb { background:var(--gray-200); border-radius:99px; }

/* ═══════════════════════════════════════════════════
   TOASTS
═══════════════════════════════════════════════════ */
#toasts {
  position:fixed; top:20px; right:20px; z-index:9999;
  display:flex; flex-direction:column; gap:8px; pointer-events:none;
}
.toast {
  background:#fff; border-radius:8px; padding:12px 16px;
  box-shadow:0 4px 20px rgba(0,0,0,.12);
  font-size:13px; font-weight:500; pointer-events:all;
  display:flex; align-items:center; gap:10px; max-width:340px;
  border-left:3px solid var(--blue-deep);
  animation: tIn .25s ease both;
}
.toast.ok  { border-left-color: var(--green); }
.toast.err { border-left-color: var(--red); }
.toast.warn{ border-left-color: var(--yellow); }
.toast.out { animation: tOut .2s ease forwards; }
@keyframes tIn  { from{opacity:0;transform:translateX(12px)} to{opacity:1;transform:none} }
@keyframes tOut { to{opacity:0;transform:translateX(12px)} }

/* ═══════════════════════════════════════════════════
   LOGIN
═══════════════════════════════════════════════════ */
#view-login {
  display:flex; align-items:center; justify-content:center;
  min-height:100vh; padding:24px;
}
.login-box {
  background:var(--ivory-card); border:1px solid var(--gray-200);
  border-radius:16px; padding:44px 40px; width:100%; max-width:400px;
  box-shadow:0 20px 60px rgba(58,53,48,.1);
  text-align:center;
}
.login-box .brand { font-family:var(--font-d); font-size:40px; font-weight:300; letter-spacing:.02em; }
.login-box .sub   { font-size:11px; letter-spacing:.14em; text-transform:uppercase; color:var(--gray-400); margin:4px 0 36px; }
.fld { text-align:left; margin-bottom:18px; }
.fld label { display:block; font-size:10px; font-weight:600; letter-spacing:.1em; text-transform:uppercase; color:var(--gray-600); margin-bottom:6px; }
.fld input {
  width:100%; padding:11px 14px; border:1.5px solid var(--gray-200);
  border-radius:6px; background:var(--ivory); color:var(--gray-800);
  font-family:var(--font-b); font-size:14px; outline:none;
  transition:border-color var(--t), box-shadow var(--t);
}
.fld input:focus { border-color:var(--blue); box-shadow:0 0 0 3px rgba(123,175,212,.15); }
.btn-login {
  width:100%; padding:12px; border:none; border-radius:6px;
  background:var(--blue-deep); color:#fff;
  font-family:var(--font-b); font-size:14px; font-weight:600;
  cursor:pointer; margin-top:8px;
  transition:background var(--t), transform var(--t);
}
.btn-login:hover { background:var(--blue); transform:translateY(-1px); }
.login-err { display:none; margin-bottom:14px; padding:9px 13px; border-radius:6px; background:var(--red-light); color:var(--red); font-size:12px; }
.login-err.show { display:block; }

/* ═══════════════════════════════════════════════════
   APP SHELL
═══════════════════════════════════════════════════ */
#view-app { display:none; }

/* TOPBAR — Google Sheets–style */
.topbar {
  height:56px; background:#fff;
  border-bottom:1px solid var(--cell-border);
  display:flex; align-items:center; padding:0 20px;
  gap:16px; position:sticky; top:0; z-index:200;
}
.topbar-icon {
  width:32px; height:32px; border-radius:4px;
  background: linear-gradient(135deg,#34a853,#1a73e8);
  display:flex; align-items:center; justify-content:center;
  flex-shrink:0;
}
.topbar-icon svg { width:18px; height:18px; }
.topbar-title {
  font-family:var(--font-d); font-size:20px; font-weight:400;
  color:var(--gray-800); letter-spacing:.01em;
}
.topbar-gap { flex:1; }
.sync-badge {
  display:none; align-items:center; gap:6px; padding:4px 12px;
  border-radius:99px; background:var(--sh-bg); color:var(--sh-green);
  font-size:11px; font-weight:600; letter-spacing:.04em;
  border:1px solid rgba(24,128,56,.2);
}
.sync-badge.on { display:flex; }
.sync-badge .dot {
  width:6px; height:6px; border-radius:50%; background:var(--sh-green);
  animation: pulse 2s ease infinite;
}
@keyframes pulse { 0%,100%{opacity:1;transform:scale(1)} 50%{opacity:.5;transform:scale(.75)} }
.topbar-user { font-size:12px; color:var(--gray-400); }
.btn-signout {
  padding:5px 12px; border:1px solid var(--gray-200); border-radius:6px;
  background:transparent; color:var(--gray-600); font-family:var(--font-b);
  font-size:12px; font-weight:500; cursor:pointer;
  transition:all var(--t);
}
.btn-signout:hover { border-color:var(--red); color:var(--red); }

/* MENU BAR — file/edit style */
.menubar {
  height:36px; background:#fff;
  border-bottom:1px solid var(--cell-border);
  display:flex; align-items:center; padding:0 8px; gap:2px;
}
.menu-tab {
  padding:0 14px; height:28px; border:none; background:transparent;
  font-family:var(--font-b); font-size:13px; font-weight:500;
  color:var(--gray-600); cursor:pointer; border-radius:4px;
  transition:background var(--t), color var(--t);
}
.menu-tab:hover { background:var(--ivory-deep); color:var(--gray-800); }
.menu-tab.active { background:var(--blue-muted); color:var(--blue-deep); }

/* TOOLBAR — spreadsheet formula bar */
.toolbar {
  height:42px; background:#fff;
  border-bottom:1px solid var(--cell-border);
  display:flex; align-items:center; padding:0 12px; gap:10px;
}
.toolbar-cell-ref {
  width:80px; height:26px; border:1px solid var(--cell-border);
  border-radius:3px; font-family:var(--font-b); font-size:12px;
  font-weight:600; text-align:center; color:var(--gray-800);
  background:var(--cell-header-bg); outline:none; padding:0 6px;
}
.toolbar-sep { width:1px; height:20px; background:var(--cell-border); flex-shrink:0; }
.toolbar-fx { font-size:12px; color:var(--gray-400); font-style:italic; }
.toolbar-formula {
  flex:1; height:26px; border:none; outline:none;
  font-family:var(--font-b); font-size:13px; color:var(--gray-800);
  background:transparent; padding:0 4px;
}

/* SYNC STRIP */
.sync-strip {
  background:#fff; border-bottom:1px solid var(--cell-border);
  padding:8px 16px; display:flex; align-items:center; gap:10px; flex-wrap:wrap;
}
.sync-strip label { font-size:11px; font-weight:600; letter-spacing:.08em; text-transform:uppercase; color:var(--gray-600); white-space:nowrap; }
.sync-strip input {
  flex:1; min-width:220px; height:30px; padding:0 10px;
  border:1px solid var(--cell-border); border-radius:4px;
  font-family:var(--font-b); font-size:12px; color:var(--gray-800);
  background:var(--cell-header-bg); outline:none;
  transition:border-color var(--t);
}
.sync-strip input:focus { border-color:var(--blue); background:#fff; }
.btn-sync {
  height:30px; padding:0 16px; border:none; border-radius:4px;
  background:var(--sh-green); color:#fff;
  font-family:var(--font-b); font-size:12px; font-weight:600;
  cursor:pointer; display:flex; align-items:center; gap:6px;
  white-space:nowrap; transition:all var(--t);
}
.btn-sync:hover { background:#145c2b; }
.btn-sync:disabled { opacity:.6; cursor:not-allowed; }
.btn-sync-clear {
  height:30px; padding:0 12px; border:1px solid var(--gray-200);
  border-radius:4px; background:transparent; color:var(--gray-400);
  font-family:var(--font-b); font-size:12px; cursor:pointer;
  transition:all var(--t);
}
.btn-sync-clear:hover { border-color:var(--red); color:var(--red); }
.sync-status { font-size:11px; color:var(--gray-400); white-space:nowrap; }
.sync-status.ok   { color:var(--sh-green); }
.sync-status.err  { color:var(--red); }
.spin {
  width:12px; height:12px; border-radius:50%;
  border:2px solid rgba(255,255,255,.3); border-top-color:#fff;
  animation:spin .6s linear infinite; flex-shrink:0;
}
@keyframes spin { to{transform:rotate(360deg)} }

/* ═══════════════════════════════════════════════════
   MAIN CONTENT
═══════════════════════════════════════════════════ */
.app-body { display:flex; min-height:calc(100vh - 134px); }

/* LEFT SIDEBAR — sheet tabs */
.sheet-sidebar {
  width:140px; flex-shrink:0; background:var(--cell-header-bg);
  border-right:1px solid var(--cell-border);
  display:flex; flex-direction:column; padding:8px 0;
}
.sheet-tab {
  margin:0 6px 2px; padding:7px 12px; border-radius:4px;
  font-size:12px; font-weight:500; color:var(--gray-600);
  cursor:pointer; transition:all var(--t); border:none;
  background:transparent; text-align:left;
  display:flex; align-items:center; gap:7px;
}
.sheet-tab:hover { background:var(--ivory-deep); color:var(--gray-800); }
.sheet-tab.active { background:#fff; color:var(--blue-deep); font-weight:600; box-shadow:0 1px 4px rgba(0,0,0,.08); }
.sheet-tab .tab-icon { font-size:14px; }

/* CONTENT PANELS */
.panel { display:none; flex:1; overflow:hidden; }
.panel.active { display:flex; flex-direction:column; }

/* ═══════════════════════════════════════════════════
   SPREADSHEET GRID
═══════════════════════════════════════════════════ */
.grid-wrap {
  flex:1; overflow:auto; position:relative;
  background:var(--cell-bg);
}

/* Row-number column + col headers */
.sg-table {
  border-collapse:collapse;
  table-layout:fixed;
  font-size:13px;
  min-width:100%;
}

/* Column headers (A, B, C...) */
.sg-table thead th {
  position:sticky; top:0; z-index:10;
  background:var(--cell-header-bg);
  border-right:1px solid var(--cell-border);
  border-bottom:2px solid var(--cell-border);
  color:var(--cell-header-txt);
  font-size:11px; font-weight:600;
  text-align:center; height:24px;
  user-select:none; white-space:nowrap;
  overflow:hidden; text-overflow:ellipsis;
  padding:0 4px;
}
.sg-table thead th.row-num-h {
  width:42px; min-width:42px; max-width:42px;
  left:0; z-index:11; background:var(--cell-header-bg);
}

/* Row numbers */
.rn {
  position:sticky; left:0; z-index:5;
  background:var(--cell-header-bg);
  border-right:1px solid var(--cell-border);
  color:var(--gray-400); font-size:11px;
  text-align:center; user-select:none;
  width:42px; min-width:42px; padding:0 4px;
  cursor:default;
}

/* Data cells */
.sg-table td {
  border-right:1px solid var(--cell-border);
  border-bottom:1px solid var(--cell-border);
  height:26px; padding:0; position:relative;
  vertical-align:middle; overflow:hidden;
  white-space:nowrap;
}
.sg-table tr:nth-child(even) td:not(.rn) { background:var(--cell-row-alt); }
.sg-table tr:hover td:not(.rn) { background:#EEF4FC; }

/* Cell selected state */
.sg-table td.selected { outline:2px solid var(--cell-select-bd); outline-offset:-2px; background:var(--cell-select) !important; }

/* Editable cell input */
.cell-input {
  position:absolute; inset:0;
  width:100%; height:100%;
  border:none; outline:none;
  background:transparent;
  font-family:var(--font-b); font-size:13px;
  color:var(--gray-800); padding:0 6px;
  cursor:default;
}
.cell-input:focus { cursor:text; background:#fff; z-index:20; }

/* Colored row types */
tr.row-income td:not(.rn) { background:#E8F5E9 !important; }
tr.row-expense td:not(.rn) { background:#FFF8F8 !important; }
tr.row-savings td:not(.rn) { background:#F0F4FF !important; }

/* Bottom add-row */
.add-row td { background:var(--cell-header-bg) !important; }
.add-row td .cell-input { color:var(--gray-400); font-style:italic; font-size:12px; }

/* ═══════════════════════════════════════════════════
   SUMMARY BAR (below grid)
═══════════════════════════════════════════════════ */
.summary-bar {
  border-top:2px solid var(--cell-border);
  background:var(--cell-header-bg);
  padding:10px 16px;
  display:flex; gap:24px; align-items:center; flex-wrap:wrap;
}
.sb-item { display:flex; flex-direction:column; gap:2px; }
.sb-label { font-size:10px; font-weight:600; letter-spacing:.1em; text-transform:uppercase; color:var(--gray-400); }
.sb-val   { font-family:var(--font-d); font-size:22px; font-weight:300; color:var(--gray-800); }
.sb-val.pos { color:var(--green); }
.sb-val.neg { color:var(--red); }

/* Health pill */
.health-pill {
  margin-left:auto; display:flex; align-items:center; gap:8px;
  padding:6px 14px; border-radius:99px; font-size:12px; font-weight:600;
}
.health-pill.green  { background:var(--green-light); color:#2d6a4f; }
.health-pill.yellow { background:var(--yellow-light); color:#7d5a00; }
.health-pill.red    { background:var(--red-light); color:var(--red); }
.health-dot { width:8px; height:8px; border-radius:50%; }
.health-pill.green  .health-dot { background:#2d6a4f; }
.health-pill.yellow .health-dot { background:#7d5a00; }
.health-pill.red    .health-dot { background:var(--red); }

/* ═══════════════════════════════════════════════════
   INVESTMENTS GRID (same pattern, 6 cols)
═══════════════════════════════════════════════════ */

/* ═══════════════════════════════════════════════════
   ANNUAL PANEL
═══════════════════════════════════════════════════ */
.annual-wrap { flex:1; overflow-y:auto; padding:24px; background:var(--ivory); }
.annual-header { margin-bottom:24px; }
.annual-header h2 { font-family:var(--font-d); font-size:30px; font-weight:300; }
.annual-header p  { font-size:13px; color:var(--gray-400); margin-top:4px; }

.year-pill-row { display:flex; gap:6px; margin-bottom:24px; }
.year-pill {
  padding:5px 14px; border:1.5px solid var(--gray-200); border-radius:99px;
  background:transparent; font-family:var(--font-b); font-size:12px; font-weight:500;
  color:var(--gray-600); cursor:pointer; transition:all var(--t);
}
.year-pill:hover { border-color:var(--blue); color:var(--blue-deep); }
.year-pill.active { background:var(--blue-deep); border-color:var(--blue-deep); color:#fff; }

.kpi-row { display:grid; grid-template-columns:repeat(3,1fr); gap:16px; margin-bottom:24px; }
.kpi-card {
  background:var(--ivory-card); border:1px solid var(--gray-200);
  border-radius:10px; padding:20px 22px; position:relative; overflow:hidden;
}
.kpi-card::after { content:''; position:absolute; top:0; left:0; right:0; height:3px; }
.kpi-card.income::after  { background:var(--green); }
.kpi-card.expense::after { background:var(--red); }
.kpi-card.net::after     { background:var(--blue); }
.kpi-label { font-size:10px; font-weight:600; letter-spacing:.12em; text-transform:uppercase; color:var(--gray-400); margin-bottom:8px; }
.kpi-val   { font-family:var(--font-d); font-size:28px; font-weight:300; }
.kpi-sub   { font-size:12px; color:var(--gray-400); margin-top:4px; }

.charts-grid { display:grid; grid-template-columns:2fr 1fr; gap:20px; margin-bottom:24px; }
.chart-card { background:var(--ivory-card); border:1px solid var(--gray-200); border-radius:10px; padding:20px; }
.chart-card h3 { font-family:var(--font-d); font-size:17px; font-weight:400; margin-bottom:16px; color:var(--gray-800); }
.chart-card canvas { max-height:260px; }

.consulting {
  background:var(--gray-800); color:var(--ivory);
  border-radius:16px; padding:30px; margin-top:4px;
}
.consulting h2 { font-family:var(--font-d); font-size:26px; font-weight:300; margin-bottom:6px; }
.consulting .csub { font-size:11px; letter-spacing:.1em; text-transform:uppercase; color:var(--gray-400); margin-bottom:24px; }
.c-insights { display:grid; grid-template-columns:repeat(auto-fill,minmax(200px,1fr)); gap:12px; margin-bottom:24px; }
.c-insight { padding:14px 16px; background:rgba(255,255,255,.05); border:1px solid rgba(255,255,255,.08); border-radius:10px; }
.c-insight-lbl { font-size:10px; font-weight:600; letter-spacing:.12em; text-transform:uppercase; color:var(--blue-light); margin-bottom:4px; }
.c-insight-val { font-family:var(--font-d); font-size:20px; font-weight:300; color:#fff; }
.c-insight-desc { font-size:11px; color:rgba(255,255,255,.45); margin-top:2px; }
.c-advice { display:flex; flex-direction:column; gap:8px; }
.c-adv-item { padding:11px 15px; background:rgba(255,255,255,.04); border-left:3px solid var(--blue); border-radius:0 6px 6px 0; font-size:13px; color:rgba(255,255,255,.75); line-height:1.55; }

/* ═══════════════════════════════════════════════════
   EMPTY / LOADING STATES
═══════════════════════════════════════════════════ */
.empty-row td { text-align:center; color:var(--gray-400); font-size:12px; padding:20px !important; font-style:italic; }

/* ═══════════════════════════════════════════════════
   MONTH SELECTOR STRIP
═══════════════════════════════════════════════════ */
.month-strip {
  display:flex; gap:0; overflow-x:auto;
  border-bottom:1px solid var(--cell-border);
  background:var(--cell-header-bg);
}
.ms-btn {
  flex-shrink:0; padding:7px 14px; border:none;
  background:transparent; font-family:var(--font-b); font-size:12px;
  font-weight:500; color:var(--gray-400); cursor:pointer;
  border-bottom:2px solid transparent;
  transition:all var(--t); white-space:nowrap;
}
.ms-btn:hover { color:var(--gray-800); background:rgba(0,0,0,.03); }
.ms-btn.active { color:var(--blue-deep); border-bottom-color:var(--blue-deep); font-weight:600; background:#fff; }

/* Year select */
.year-select {
  border:none; background:transparent; font-family:var(--font-b);
  font-size:12px; font-weight:600; color:var(--gray-600);
  cursor:pointer; outline:none; padding:7px 8px; flex-shrink:0;
  border-right:1px solid var(--cell-border);
}

/* ═══════════════════════════════════════════════════
   CONTEXT MENU
═══════════════════════════════════════════════════ */
#ctx-menu {
  display:none; position:fixed; z-index:9000;
  background:#fff; border:1px solid var(--gray-200);
  border-radius:6px; box-shadow:0 8px 24px rgba(0,0,0,.12);
  padding:4px 0; min-width:160px;
}
#ctx-menu.show { display:block; }
.ctx-item {
  padding:8px 16px; font-size:13px; color:var(--gray-800);
  cursor:pointer; display:flex; align-items:center; gap:10px;
}
.ctx-item:hover { background:var(--ivory-deep); }
.ctx-item.danger { color:var(--red); }
.ctx-sep { border-top:1px solid var(--gray-200); margin:4px 0; }

/* ═══════════════════════════════════════════════════
   RESPONSIVE
═══════════════════════════════════════════════════ */
@media(max-width:700px) {
  .sheet-sidebar { width:48px; }
  .sheet-tab span { display:none; }
  .kpi-row { grid-template-columns:1fr; }
  .charts-grid { grid-template-columns:1fr; }
}
</style>
</head>
<body>

<div id="toasts"></div>
<div id="ctx-menu">
  <div class="ctx-item" onclick="ctxAction('insert-above')">⬆ Insert row above</div>
  <div class="ctx-item" onclick="ctxAction('insert-below')">⬇ Insert row below</div>

const AUTH  = (typeof window.__AUTH__ !== "undefined") ? window.__AUTH__ : { username:"michellpf", password:"3360076" };
const MONTHS = ["Ene","Feb","Mar","Abr","May","Jun","Jul","Ago","Sep","Oct","Nov","Dic"];
const MONTHS_FULL = ["Enero","Febrero","Marzo","Abril","Mayo","Junio","Julio","Agosto","Septiembre","Octubre","Noviembre","Diciembre"];
const CATEGORIES  = ["Income","Food","Housing","Transport","Health","Entertainment","Savings","Other"];

/* ── FORMATTING ─────────────────────────────────────────────── */

const uid = () => Math.random().toString(36).slice(2,9);

/* ── STATE ───────────────────────────────────────────────────── */

/* ═══════════════════════════════════════════════════════════════
   DATA LAYER — localStorage
   Swap DB.getLedger / DB.saveLedger etc. for Firebase/Supabase
═══════════════════════════════════════════════════════════════ */
const DB = {
  _load(){ try{ return JSON.parse(localStorage.getItem(LS_DATA))||{ledger:{},investments:{}}; }catch{ return {ledger:{},investments:{}}; } },
  _save(d){ localStorage.setItem(LS_DATA,JSON.stringify(d)); },

  getLedger(y,m){
    const d=this._load(), k=`${y}-${m}`;
    if(!d.ledger[k]) d.ledger[k]={income:0,rows:[]};
    return d.ledger[k];
  },
  saveLedger(y,m,data){
    const d=this._load();
    d.ledger[`${y}-${m}`]=data;
    this._save(d);
  },
  getInv(y,m){
    const d=this._load(), k=`${y}-${m}`;
    if(!d.investments[k]) d.investments[k]=[];
    return d.investments[k];
  },
  saveInv(y,m,data){
    const d=this._load();
    d.investments[`${y}-${m}`]=data;
    this._save(d);
  },
  getYearLedger(y){
    const d=this._load();
    return Array.from({length:12},(_,i)=>d.ledger[`${y}-${i}`]||{income:0,rows:[]});
  },
  getYearInv(y){
    const d=this._load();
    return Array.from({length:12},(_,i)=>d.investments[`${y}-${i}`]||[]);
  }
};

/* ═══════════════════════════════════════════════════════════════
   MONTH STRIP BUILDER
═══════════════════════════════════════════════════════════════ */
function buildMonthStrip(containerId, yearVal, activeMonth, onYearChange, onMonthChange){
  const c = document.getElementById(containerId);
  const years = [];
  const now = new Date().getFullYear();
  for(let y=now+2;y>=2020;y--) years.push(y);

  let html = `<select class="year-select" onchange="${onYearChange}(parseInt(this.value))">`
    + years.map(y=>`<option value="${y}" ${y===yearVal?"selected":""}>${y}</option>`).join("")
    + `</select>`;

  html += MONTHS.map((m,i)=>
    `<button class="ms-btn ${i===activeMonth?"active":""}" onclick="${onMonthChange}(${i})">${m}</button>`
  ).join("");

  c.innerHTML = html;
}

function ctxAction(action){
  if(!ctxTarget) return;
  const {sheet, rowIndex} = ctxTarget;

  if(sheet==="ledger"){
    const data = DB.getLedger(ledgerYear, ledgerMonth);

  } else if(sheet==="investments"){

    if(action==="delete"){

    } else if(action==="insert-above"||action==="insert-below"){
      const offset = action==="insert-below"?1:0;
      data.splice(rowIndex+offset,0,{id:uid(),date:today(),asset:"",type:"ETF",capital:0,currentValue:0,src:"manual"});
      DB.saveInv(invYear, invMonth, data);
      renderInv();
    }
  }
}

/* ═══════════════════════════════════════════════════════════════
   SPREADSHEET CELL EDITOR
   Each cell is an <input> — Tab moves right, Enter moves down,
   ArrowKeys navigate. Changes save on blur/Enter.
═══════════════════════════════════════════════════════════════ */
function makeCell(value, opts={}){
  const inp = document.createElement("input");
  inp.type = "text";
  inp.className = "cell-input";
  inp.value = value ?? "";
  if(opts.placeholder) inp.placeholder = opts.placeholder;
  if(opts.align) inp.style.textAlign = opts.align;

  // Readonly styling for computed cells
  if(opts.readonly){
    inp.readOnly = true;
    inp.style.color = "var(--gray-400)";
    inp.style.background = "transparent";
  }

  // Dropdown simulation via datalist
  if(opts.list && opts.listId){
    inp.setAttribute("list", opts.listId);
  }

  inp.addEventListener("focus", ()=>{
    inp.closest("td")?.classList.add("selected");
    // Get column letter from th index
    const td = inp.closest("td");
    const tr = td?.closest("tr");
    if(td && tr){
      const colIdx = Array.from(tr.children).indexOf(td);
      const rowIdx = Array.from(tr.closest("tbody").children).indexOf(tr) + 2;
      const colLetter = "ABCDEFGHIJKLMNOP"[colIdx-1] || String(colIdx);
      updateFormulaBar(`${colLetter}${rowIdx}`, inp.value);
    }
  });

  inp.addEventListener("blur", ()=>{
    inp.closest("td")?.classList.remove("selected");
    if(opts.onchange) opts.onchange(inp.value);
  });

  inp.addEventListener("input", ()=>{
    updateFormulaBar(document.getElementById("cell-ref").value, inp.value);
  });

  inp.addEventListener("keydown", e=>{
    if(e.key==="Tab"){
      e.preventDefault();
      const next = getAdjacentCell(inp, e.shiftKey?"left":"right");
      if(next) next.focus();
    } else if(e.key==="Enter"){
      e.preventDefault();
      if(opts.onchange) opts.onchange(inp.value);
      const next = getAdjacentCell(inp,"down");
      if(next) next.focus();
      else if(opts.onEnterNewRow) opts.onEnterNewRow();
    } else if(e.key==="ArrowUp"){ const n=getAdjacentCell(inp,"up"); if(n){e.preventDefault();n.focus();} }
    else if(e.key==="ArrowDown"){ const n=getAdjacentCell(inp,"down"); if(n){e.preventDefault();n.focus();} }
    else if(e.key==="Escape"){ inp.blur(); }
  });

  return inp;
}

function getAdjacentCell(inp, dir){
  const td = inp.closest("td");
  const tr = td?.closest("tr");
  const tbody = tr?.closest("tbody");
  if(!td||!tr||!tbody) return null;

  const tds = Array.from(tr.children);
  const trs = Array.from(tbody.children);
  const ci  = tds.indexOf(td);
  const ri  = trs.indexOf(tr);

  let targetTd;
  if(dir==="right") targetTd = tds[ci+1];
  else if(dir==="left") targetTd = tds[ci-1];
  else if(dir==="down"){ const ntr=trs[ri+1]; targetTd = ntr?.children[ci]; }
  else if(dir==="up"){   const ptr=trs[ri-1]; targetTd = ptr?.children[ci]; }

  return targetTd?.querySelector(".cell-input");
}

/* ═══════════════════════════════════════════════════════════════
   DATALISTS (for dropdowns in cells)
═══════════════════════════════════════════════════════════════ */
function ensureDataLists(){

  const cats = document.createElement("datalist");
  cats.id = "dl-cat";

  document.body.appendChild(cats);

  types.id = "dl-type";
  ["income","expense"].forEach(c=>{ const o=document.createElement("option"); o.value=c; types.appendChild(o); });
  document.body.appendChild(types);

  const itypes = document.createElement("datalist");
  itypes.id = "dl-invtype";
  INV_TYPES.forEach(c=>{ const o=document.createElement("option"); o.value=c; itypes.appendChild(o); });
  document.body.appendChild(itypes);
}

/* ═══════════════════════════════════════════════════════════════
   MODULE 1 — LEDGER SPREADSHEET
═══════════════════════════════════════════════════════════════ */
function initLedger(){
  buildMonthStrip("ledger-month-strip", ledgerYear, ledgerMonth, "setLedgerYear","setLedgerMonth");
  renderLedger();
}

function setLedgerYear(y){ ledgerYear=y; buildMonthStrip("ledger-month-strip",ledgerYear,ledgerMonth,"setLedgerYear","setLedgerMonth"); renderLedger(); }
function setLedgerMonth(m){ ledgerMonth=m; buildMonthStrip("ledger-month-strip",ledgerYear,ledgerMonth,"setLedgerYear","setLedgerMonth"); renderLedger(); }

function renderLedger(){
  ensureDataLists();
  const data = DB.getLedger(ledgerYear, ledgerMonth);
  const tbody = document.getElementById("ledger-tbody");
  tbody.innerHTML = "";

  // Add existing rows
  data.rows.forEach((row, ri) => {
    tbody.appendChild(makeLedgerRow(row, ri, data));
  });

  // "Add row" placeholder at bottom
  const phantom = document.createElement("tr");
  phantom.className = "add-row";
  const pCells = ["","Nueva entrada...","","","",""];
  const pRn = document.createElement("td");
  pRn.className = "rn";
  pRn.textContent = data.rows.length + 2;
  phantom.appendChild(pRn);

  pCells.forEach((ph, ci) => {
    const td = document.createElement("td");
    if(ci===0){
      const inp = makeCell("", {
        placeholder:"YYYY-MM-DD",
        onEnterNewRow: ()=>{ addLedgerRow(ledgerYear, ledgerMonth); },
        onchange: val => {
          if(val.trim()){
            // Kick off a new full row entry
            addLedgerRow(ledgerYear, ledgerMonth, { date: val });
          }
        }
      });
      inp.addEventListener("focus", ()=> { if(!inp.value) inp.value = today(); });
      td.appendChild(inp);
    } else {
      const inp = document.createElement("input");
      inp.className = "cell-input";
      inp.placeholder = ph;
      inp.readOnly = true;
      inp.style.color = "var(--gray-400)";
      inp.style.fontStyle = "italic";
      td.appendChild(inp);
    }
    phantom.appendChild(td);
  });
  tbody.appendChild(phantom);

  renderLedgerSummary(data);
}

function makeLedgerRow(row, ri, data){
  const tr = document.createElement("tr");

  // Row type coloring
  if(row.type==="income") tr.className = "row-income";
  else if(row.cat==="Savings") tr.className = "row-savings";
  else tr.className = "row-expense";

  // Row number
  const rn = document.createElement("td");
  rn.className = "rn";
  rn.textContent = ri + 2; // +2 because row 1 is header
  rn.title = row.src==="sheets"?"Importado de Sheets":"Ingresado manualmente";
  if(row.src==="sheets") rn.style.background = "#E6F4EA";
  tr.appendChild(rn);

  const save = () => {
    DB.saveLedger(ledgerYear, ledgerMonth, data);
    renderLedger();
  };

  // Fecha
  const tdDate = document.createElement("td");
  tdDate.appendChild(makeCell(row.date||"", { placeholder:"YYYY-MM-DD", onchange: v=>{ row.date=v; save(); } }));
  tr.appendChild(tdDate);

  // Descripción
  const tdDesc = document.createElement("td");
  tdDesc.appendChild(makeCell(row.desc||"", { placeholder:"Descripción...", onchange: v=>{ row.desc=v; save(); } }));
  tr.appendChild(tdDesc);

  // Categoría
  const tdCat = document.createElement("td");
  tdCat.appendChild(makeCell(row.cat||"Other", { list:true, listId:"dl-cat", onchange: v=>{ row.cat=v; save(); } }));
  tr.appendChild(tdCat);

  // Tipo
  const tdType = document.createElement("td");
  const typeInp = makeCell(row.type||"expense", { list:true, listId:"dl-type", align:"center", onchange: v=>{ row.type=v.toLowerCase(); save(); } });
  typeInp.style.fontWeight = "600";
  typeInp.style.color = row.type==="income"?"var(--green)":"var(--red)";
  tdType.appendChild(typeInp);
  tr.appendChild(tdType);

  // Monto
  const tdAmt = document.createElement("td");
  const amtInp = makeCell(row.amount||"", { placeholder:"0", align:"right", onchange: v=>{ row.amount=parseFloat(v.replace(/[^0-9.-]/g,""))||0; save(); } });
  amtInp.style.fontWeight = "500";
  amtInp.style.color = row.type==="income"?"var(--green)":"var(--red)";
  tdAmt.appendChild(amtInp);
  tr.appendChild(tdAmt);

  // Right-click context menu
  tr.addEventListener("contextmenu", e=>showCtxMenu(e,"ledger",ri));

  return tr;
}

function addLedgerRow(y, m, defaults={}){
  const data = DB.getLedger(y, m);
  data.rows.push({
    id: uid(),
    date: defaults.date || today(),
    desc: defaults.desc || "",
    cat:  defaults.cat  || "Other",
    type: defaults.type || "expense",
    amount: defaults.amount || 0,
    src: "manual"
  });

function makeInvRow(row,ri,data){
  const tr = document.createElement("tr");
  const rn = document.createElement("td"); rn.className="rn"; rn.textContent=ri+2;
  if(row.src==="sheets") rn.style.background="#E6F4EA";
  tr.appendChild(rn);

  const profit = (row.currentValue||0)-(row.capital||0);
  const roi    = row.capital>0?(profit/row.capital)*100:0;

  const save=()=>{ DB.saveInv(invYear,invMonth,data); renderInv(); };

  const cols = [
    { val:row.date||"",   ph:"YYYY-MM-DD",      onchange:v=>{row.date=v;save();} },
    { val:row.asset||"",  ph:"Nombre activo...", onchange:v=>{row.asset=v;save();}, listId:"dl-invtype" },
    { val:row.type||"ETF",ph:"Tipo",             onchange:v=>{row.type=v;save();}, listId:"dl-invtype" },
    { val:row.capital||"",ph:"0",                onchange:v=>{row.capital=parseFloat(v.replace(/[^0-9.-]/g,""))||0;save();}, align:"right" },
    { val:row.currentValue||"",ph:"0",           onchange:v=>{row.currentValue=parseFloat(v.replace(/[^0-9.-]/g,""))||0;save();}, align:"right" },
  ];

  cols.forEach(c=>{
    const td=document.createElement("td");
    const inp=makeCell(c.val,{placeholder:c.ph,onchange:c.onchange,align:c.align,list:!!c.listId,listId:c.listId});
    td.appendChild(inp); tr.appendChild(td);
  });

  // Computed: Ganancia (readonly)
  const tdP = document.createElement("td");
  const pInp = makeCell(profit!==0?profit:"",{readonly:true,align:"right"});
  pInp.value = profit!==0?cop(profit):"";
  pInp.style.color = profit>=0?"var(--green)":"var(--red)";
  pInp.style.fontWeight="500";
  tdP.appendChild(pInp); tr.appendChild(tdP);

  // Computed: ROI (readonly)

  rInp.style.fontWeight="600";
  tdR.appendChild(rInp); tr.appendChild(tdR);

  tr.addEventListener("contextmenu",e=>showCtxMenu(e,"investments",ri));
  return tr;
}

/* ═══════════════════════════════════════════════════════════════
   GOOGLE SHEETS SYNC — bidirectional
   ▸ PULL: fetch CSV → parse → merge into localStorage → re-render
   ▸ EXPORT hint: copy from spreadsheet UI back to Sheets manually
     (full push requires a backend/OAuth — noted in comments)
═══════════════════════════════════════════════════════════════ */

/* CSV parser — RFC-4180 compliant */
function parseCSV(text){
  const rows=[]; let row=[],field="",inQ=false;
  for(let i=0;i<text.length;i++){
    const ch=text[i],nx=text[i+1];
    if(inQ){
      if(ch==='"'&&nx==='"'){field+='"';i++;}
      else if(ch==='"'){inQ=false;}
      else{field+=ch;}
    } else {
      if(ch==='"'){inQ=true;}
      else if(ch===','){row.push(field.trim());field="";}
      else if(ch==='\n'||(ch==='\r'&&nx==='\n')){
        if(ch==='\r')i++;
        row.push(field.trim());field="";
        if(row.some(c=>c))rows.push(row);
        row=[];
      } else {field+=ch;}
    }
  }
  if(field.trim()||row.length){row.push(field.trim());if(row.some(c=>c))rows.push(row);}
  return rows;
}

/* Normalize date strings to YYYY-MM-DD */
function normDate(raw){
  if(!raw) return null;
  const s=raw.toString().trim();
  if(/^\d{4}-\d{2}-\d{2}$/.test(s)) return s;
  const parts=s.split(/[\/-\.]/);
  if(parts.length===3){
    let[a,b,c]=parts;
    if(c.length===4){
      const day=parseInt(a,10);
      return day>12?`${c}-${b.padStart(2,"0")}-${a.padStart(2,"0")}`:`${c}-${b.padStart(2,"0")}-${a.padStart(2,"0")}`;
    }
    if(a.length===4) return `${a}-${b.padStart(2,"0")}-${c.padStart(2,"0")}`;
    if(c.length===2){ const yr=parseInt(c,10)<50?"20"+c:"19"+c; return `${yr}-${b.padStart(2,"0")}-${a.padStart(2,"0")}`; }
  }
  const d=new Date(s); return isNaN(d)?null:d.toISOString().slice(0,10);
}

/* Detect sheet type from header row */
function detectType(headers){
  const h=headers.map(x=>x.toLowerCase().trim());
  const isInv=h.some(x=>x.includes("capital")||x.includes("asset")||x.includes("activo")||x.includes("currentvalue")||x.includes("current value"));
  return isInv?"investments":"transactions";
}

/* Parse & merge transactions */
function mergeTransactions(rows){
  let added=0, skipped=0;
  const bym={};
  rows.forEach(row=>{
    const date=normDate(row[0]); if(!date) return;
    const desc   = row[1]||"Importado";
    const cat    = row[2]||"Other";
    const typeRaw= (row[3]||"expense").toLowerCase();
    const type   = (typeRaw.includes("income")||typeRaw.includes("ingreso"))?"income":"expense";
    const amount = parseFloat((row[4]||"0").replace(/[^0-9.-]/g,""));
    if(!amount||amount<=0) return;

    const d=new Date(date+"T12:00:00");
    const k=`${d.getFullYear()}-${d.getMonth()}`;
    (bym[k]=bym[k]||[]).push({date,desc,cat,type,amount});
  });

  const dbData = DB._load();
  Object.entries(bym).forEach(([k,txs])=>{
    const[y,m]=k.split("-").map(Number);
    if(!dbData.ledger[k]) dbData.ledger[k]={income:0,rows:[]};
    const existing=dbData.ledger[k];

    // Set base income if this is a base income row
    const baseRow=txs.find(t=>t.type==="income"&&t.desc.toLowerCase().includes("base"));
    if(baseRow&&!existing.income){ existing.income=baseRow.amount; }

    const fps=new Set(existing.rows.map(r=>`${r.date}|${r.desc.toLowerCase()}|${r.amount}`));
    txs.forEach(tx=>{
      const fp=`${tx.date}|${tx.desc.toLowerCase()}|${tx.amount}`;
      if(fps.has(fp)){skipped++;return;}
      existing.rows.push({id:uid(),src:"sheets",...tx});
      fps.add(fp); added++;
    });
    existing.rows.sort((a,b)=>a.date.localeCompare(b.date));
  });

  DB._save(dbData);
  return {added,skipped};
}

/* Parse & merge investments */
function mergeInvestments(rows){
  let added=0, skipped=0;
  const bym={};
  rows.forEach(row=>{
    const date=normDate(row[0]); if(!date) return;
    const asset  = row[1]||"Unknown";
    const type   = row[2]||"Other";
    const capital= parseFloat((row[3]||"0").replace(/[^0-9.-]/g,""));
    const curVal = parseFloat((row[4]||"0").replace(/[^0-9.-]/g,""))||capital;
    if(!capital||capital<=0) return;

    const d=new Date(date+"T12:00:00");
    const k=`${d.getFullYear()}-${d.getMonth()}`;
    (bym[k]=bym[k]||[]).push({date,asset,type,capital,currentValue:curVal});
  });

  const dbData=DB._load();
  Object.entries(bym).forEach(([k,invs])=>{
    const[y,m]=k.split("-").map(Number);
    if(!dbData.investments[k]) dbData.investments[k]=[];
    const existing=dbData.investments[k];
    const fps=new Set(existing.map(i=>`${i.date}|${i.asset.toLowerCase()}|${i.capital}`));
    invs.forEach(inv=>{
      const fp=`${inv.date}|${inv.asset.toLowerCase()}|${inv.capital}`;
      if(fps.has(fp)){skipped++;return;}
      existing.push({id:uid(),src:"sheets",...inv});
      fps.add(fp); added++;
    });
  });

  DB._save(dbData);
  return {added,skipped};
}

  const el=document.getElementById("sync-status");
  el.textContent=msg; el.className="sync-status "+cls;
}

function updateSyncBadge(){
  const url=localStorage.getItem(LS_URL);
  document.getElementById("sync-badge").classList.toggle("on",!!url);
  const ts=localStorage.getItem(LS_SYNCED);
  if(ts){
    const d=new Date(ts);
    setSyncStatus(`Último sync: ${d.toLocaleDateString("es-CO")} ${d.toLocaleTimeString("es-CO",{hour:"2-digit",minute:"2-digit"})}`,"ok");
  }
}

async function doSync(){
  const url=document.getElementById("sync-url").value.trim();
  if(!url){ toast("Ingresa una URL de Google Sheets primero.","warn"); return; }
  if(!url.startsWith("http")){ setSyncStatus("URL inválida.","err"); return; }

  localStorage.setItem(LS_URL,url);
  setSyncBtn(true);
  setSyncStatus("Conectando...","");

  let csvText;
  try {
    const proxies=[
      `https://api.allorigins.win/raw?url=${encodeURIComponent(url)}`,
      `https://corsproxy.io/?${encodeURIComponent(url)}`
    ];
    let res,lastErr;
    for(const p of proxies){
      try{ res=await fetch(p,{cache:"no-cache"}); if(res.ok) break; }
      catch(e){ lastErr=e; }
    }
    if(!res||!res.ok) throw lastErr||new Error("HTTP "+res?.status);
    csvText=await res.text();
  } catch(err){
    setSyncBtn(false);
    setSyncStatus("Error de red. Verifica que el sheet esté publicado como CSV.","err");
    toast("Sync fallido. Verifica la URL y la publicación del sheet.","err");
    console.error("[Sync]",err);
    return;
  }

  if(csvText.trimStart().startsWith("<")){
    setSyncBtn(false);
    setSyncStatus("Recibido HTML en vez de CSV. Verifica ?output=csv en la URL.","err");
    return;
  }

  const rows=parseCSV(csvText);
  if(rows.length<2){
    setSyncBtn(false);
    setSyncStatus("Sheet vacío o sin filas de datos.","err");
    return;
  }

  const headers=rows[0];
  const data   =rows.slice(1);
  const type   =detectType(headers);

  let result;
  if(type==="investments") result=mergeInvestments(data);
  else                     result=mergeTransactions(data);

  localStorage.setItem(LS_SYNCED,new Date().toISOString());
  updateSyncBadge();
  setSyncBtn(false);

  const msg=`${result.added} nuevos registros importados · ${result.skipped} duplicados omitidos.`;
  setSyncStatus(msg,"ok");
  toast(msg,"ok");

  // Re-render active views
  renderLedger();
  renderInv();
  if(document.getElementById("panel-annual").classList.contains("active")) renderAnnual();
}

function clearSync(){
  if(!confirm("¿Desconectar Google Sheets? Los datos importados se conservan.")) return;
  document.getElementById("sync-url").value="";
  localStorage.removeItem(LS_URL);
  localStorage.removeItem(LS_SYNCED);
  setSyncStatus("","");
  updateSyncBadge();
  toast("Sheets desconectado. Datos locales conservados.","info");
}

/* Auto-sync on login if URL saved */
function autoSync(){
  const url=localStorage.getItem(LS_URL);
  if(url){
    document.getElementById("sync-url").value=url;
    setTimeout(()=>doSync(),800);
  }
}

/* ═══════════════════════════════════════════════════════════════
   INIT
═══════════════════════════════════════════════════════════════ */
function initApp(){
  updateSyncBadge();
  initLedger();
  initInv();
  autoSync();
}

document.addEventListener("DOMContentLoaded", ()=>{ initAuth(); });
</script>
