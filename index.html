<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Michell · Finance</title>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@300;400;500&family=DM+Sans:wght@300;400;500;600&display=swap" rel="stylesheet"/>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
<style>
:root {
  --ivory:      #F7F5F0;
  --card:       #FAFAF7;
  --deep:       #EEEBE3;
  --blue:       #7BAFD4;
  --blue-d:     #4F8DB4;
  --blue-m:     #D2E8F5;
  --g200:       #DDD9D0;
  --g400:       #A09890;
  --g600:       #6B6560;
  --g800:       #3A3530;
  --green:      #4F9B73;
  --green-l:    #D4EDE2;
  --yellow:     #C8941A;
  --yellow-l:   #FBF0D0;
  --red:        #C05050;
  --red-l:      #F5DADA;
  --shg:        #188038;
  --shbg:       #E6F4EA;
  --cb:         #FFFFFF;
  --cborder:    #E0E0E0;
  --chbg:       #F8F9FA;
  --t:          .18s ease;
  --fd:         'Cormorant Garamond', serif;
  --fb:         'DM Sans', sans-serif;
}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html{font-size:14px}
body{font-family:var(--fb);background:var(--ivory);color:var(--g800);min-height:100vh;-webkit-font-smoothing:antialiased}
::-webkit-scrollbar{width:6px;height:6px}
::-webkit-scrollbar-thumb{background:var(--g200);border-radius:99px}

/* ── TOAST ── */
#toasts{position:fixed;top:20px;right:20px;z-index:9999;display:flex;flex-direction:column;gap:8px}
.toast{background:#fff;border-radius:8px;padding:12px 16px;box-shadow:0 4px 20px rgba(0,0,0,.12);font-size:13px;font-weight:500;max-width:340px;border-left:3px solid var(--blue-d);animation:tIn .25s ease both}
.toast.ok{border-left-color:var(--green)}.toast.err{border-left-color:var(--red)}
@keyframes tIn{from{opacity:0;transform:translateX(10px)}to{opacity:1;transform:none}}

/* ── LOGIN ── */
#pg-login{display:flex;align-items:center;justify-content:center;min-height:100vh;padding:24px}
#pg-login.hide{display:none}
.lbox{background:var(--card);border:1px solid var(--g200);border-radius:16px;padding:44px 40px;width:100%;max-width:390px;box-shadow:0 20px 60px rgba(58,53,48,.1);text-align:center}
.lbrand{font-family:var(--fd);font-size:40px;font-weight:300;letter-spacing:.02em}
.lsub{font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--g400);margin:4px 0 36px}
.lf{text-align:left;margin-bottom:18px}
.lf label{display:block;font-size:10px;font-weight:600;letter-spacing:.1em;text-transform:uppercase;color:var(--g600);margin-bottom:6px}
.lf input{width:100%;padding:12px 14px;border:1.5px solid var(--g200);border-radius:6px;background:var(--ivory);color:var(--g800);font-family:var(--fb);font-size:14px;outline:none;transition:border-color var(--t)}
.lf input:focus{border-color:var(--blue)}
.lerr{display:none;margin-bottom:16px;padding:10px 13px;border-radius:6px;background:var(--red-l);color:var(--red);font-size:13px;text-align:left}
.lbtn{width:100%;padding:13px;border:none;border-radius:6px;background:var(--blue-d);color:#fff;font-family:var(--fb);font-size:14px;font-weight:600;cursor:pointer;margin-top:4px;transition:background var(--t)}
.lbtn:hover{background:var(--blue)}

/* ── APP SHELL ── */
#pg-app{display:none}
#pg-app.show{display:block}

/* TOPBAR */
.topbar{height:56px;background:#fff;border-bottom:1px solid var(--cborder);display:flex;align-items:center;padding:0 20px;gap:14px;position:sticky;top:0;z-index:200}
.tb-icon{width:32px;height:32px;border-radius:4px;background:linear-gradient(135deg,#34a853,#1a73e8);display:flex;align-items:center;justify-content:center;flex-shrink:0}
.tb-icon svg{width:18px;height:18px}
.tb-title{font-family:var(--fd);font-size:20px;font-weight:400}
.tb-gap{flex:1}
.sync-pill{display:none;align-items:center;gap:6px;padding:4px 12px;border-radius:99px;background:var(--shbg);color:var(--shg);font-size:11px;font-weight:600;border:1px solid rgba(24,128,56,.2)}
.sync-pill.on{display:flex}
.sync-dot{width:6px;height:6px;border-radius:50%;background:var(--shg);animation:pdot 2s ease infinite}
@keyframes pdot{0%,100%{opacity:1}50%{opacity:.4}}
.tb-user{font-size:12px;color:var(--g400)}
.btn-out{padding:5px 12px;border:1px solid var(--g200);border-radius:6px;background:transparent;color:var(--g600);font-family:var(--fb);font-size:12px;font-weight:500;cursor:pointer;transition:all var(--t)}
.btn-out:hover{border-color:var(--red);color:var(--red)}

/* MENUBAR */
.menubar{height:36px;background:#fff;border-bottom:1px solid var(--cborder);display:flex;align-items:center;padding:0 8px;gap:2px}
.mtab{padding:0 14px;height:28px;border:none;background:transparent;font-family:var(--fb);font-size:13px;font-weight:500;color:var(--g600);cursor:pointer;border-radius:4px;transition:all var(--t)}
.mtab:hover{background:var(--deep);color:var(--g800)}
.mtab.on{background:var(--blue-m);color:var(--blue-d)}

/* FORMULA BAR */
.fbar{height:38px;background:#fff;border-bottom:1px solid var(--cborder);display:flex;align-items:center;padding:0 12px;gap:10px}
.fbar-ref{width:72px;height:24px;border:1px solid var(--cborder);border-radius:3px;font-family:var(--fb);font-size:12px;font-weight:600;text-align:center;color:var(--g800);background:var(--chbg);outline:none;padding:0 4px}
.fbar-sep{width:1px;height:18px;background:var(--cborder);flex-shrink:0}
.fbar-fx{font-size:12px;color:var(--g400);font-style:italic}
.fbar-val{flex:1;font-family:var(--fb);font-size:13px;color:var(--g800);background:transparent;border:none;outline:none}

/* SYNC STRIP */
.sstrip{background:#fff;border-bottom:1px solid var(--cborder);padding:8px 16px;display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.sstrip label{font-size:11px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--g600);white-space:nowrap}
.sstrip input{flex:1;min-width:200px;height:30px;padding:0 10px;border:1px solid var(--cborder);border-radius:4px;font-family:var(--fb);font-size:12px;color:var(--g800);background:var(--chbg);outline:none;transition:border-color var(--t)}
.sstrip input:focus{border-color:var(--blue);background:#fff}
.btn-sync{height:30px;padding:0 16px;border:none;border-radius:4px;background:var(--shg);color:#fff;font-family:var(--fb);font-size:12px;font-weight:600;cursor:pointer;display:flex;align-items:center;gap:6px;white-space:nowrap;transition:all var(--t)}
.btn-sync:hover{background:#145c2b}
.btn-sync:disabled{opacity:.6;cursor:not-allowed}
.btn-sdis{height:30px;padding:0 12px;border:1px solid var(--g200);border-radius:4px;background:transparent;color:var(--g400);font-family:var(--fb);font-size:12px;cursor:pointer;transition:all var(--t)}
.btn-sdis:hover{border-color:var(--red);color:var(--red)}
.sstatus{font-size:11px;color:var(--g400);white-space:nowrap}
.sstatus.ok{color:var(--shg)}.sstatus.err{color:var(--red)}
.spinn{width:12px;height:12px;border-radius:50%;border:2px solid rgba(255,255,255,.3);border-top-color:#fff;animation:spin .6s linear infinite;flex-shrink:0}
@keyframes spin{to{transform:rotate(360deg)}}

/* APP BODY */
.abody{display:flex;min-height:calc(100vh - 170px)}

/* SIDEBAR */
.sidebar{width:130px;flex-shrink:0;background:var(--chbg);border-right:1px solid var(--cborder);display:flex;flex-direction:column;padding:8px 0}
.stab{margin:0 6px 2px;padding:8px 12px;border-radius:4px;font-size:12px;font-weight:500;color:var(--g600);cursor:pointer;border:none;background:transparent;text-align:left;display:flex;align-items:center;gap:7px;transition:all var(--t)}
.stab:hover{background:var(--deep);color:var(--g800)}
.stab.on{background:#fff;color:var(--blue-d);font-weight:600;box-shadow:0 1px 4px rgba(0,0,0,.08)}

/* PANELS */
.panel{display:none;flex:1;overflow:hidden;flex-direction:column}
.panel.on{display:flex}

/* MONTH STRIP */
.mstrip{display:flex;overflow-x:auto;border-bottom:1px solid var(--cborder);background:var(--chbg);flex-shrink:0}
.yr-sel{border:none;background:transparent;font-family:var(--fb);font-size:12px;font-weight:600;color:var(--g600);cursor:pointer;outline:none;padding:7px 8px;flex-shrink:0;border-right:1px solid var(--cborder)}
.mbtn{flex-shrink:0;padding:7px 13px;border:none;background:transparent;font-family:var(--fb);font-size:12px;font-weight:500;color:var(--g400);cursor:pointer;border-bottom:2px solid transparent;transition:all var(--t);white-space:nowrap}
.mbtn:hover{color:var(--g800);background:rgba(0,0,0,.03)}
.mbtn.on{color:var(--blue-d);border-bottom-color:var(--blue-d);font-weight:600;background:#fff}

/* GRID */
.gwrap{flex:1;overflow:auto;background:var(--cb)}
.sgt{border-collapse:collapse;table-layout:fixed;font-size:13px;min-width:100%}
.sgt thead th{position:sticky;top:0;z-index:10;background:var(--chbg);border-right:1px solid var(--cborder);border-bottom:2px solid var(--cborder);color:#444;font-size:11px;font-weight:600;text-align:center;height:24px;user-select:none;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;padding:0 4px}
.sgt thead th.rnh{width:42px;min-width:42px;left:0;z-index:11}
.rn{position:sticky;left:0;z-index:5;background:var(--chbg);border-right:1px solid var(--cborder);color:var(--g400);font-size:11px;text-align:center;width:42px;min-width:42px;padding:0 4px;cursor:default}
.sgt td{border-right:1px solid var(--cborder);border-bottom:1px solid var(--cborder);height:26px;padding:0;position:relative;overflow:hidden;white-space:nowrap;vertical-align:middle}
.sgt tr:nth-child(even) td:not(.rn){background:#FAFAFA}
.sgt tr:hover td:not(.rn){background:#EEF4FC}
.ci{position:absolute;inset:0;width:100%;height:100%;border:none;outline:none;background:transparent;font-family:var(--fb);font-size:13px;color:var(--g800);padding:0 6px;cursor:default}
.ci:focus{cursor:text;background:#fff;z-index:20;box-shadow:inset 0 0 0 2px var(--blue-d)}
tr.ri td:not(.rn){background:#E8F5E9!important}
tr.re td:not(.rn){background:#FFF8F8!important}
tr.rs td:not(.rn){background:#F0F4FF!important}
tr.ph td{background:var(--chbg)!important}
tr.ph .ci{color:var(--g400);font-style:italic;font-size:12px}

/* SUMMARY BAR */
.sumbar{border-top:2px solid var(--cborder);background:var(--chbg);padding:10px 16px;display:flex;gap:24px;align-items:center;flex-wrap:wrap;flex-shrink:0}
.si-lbl{font-size:10px;font-weight:600;letter-spacing:.1em;text-transform:uppercase;color:var(--g400)}
.si-val{font-family:var(--fd);font-size:22px;font-weight:300;color:var(--g800)}
.si-val.pos{color:var(--green)}.si-val.neg{color:var(--red)}
.hpill{margin-left:auto;display:flex;align-items:center;gap:8px;padding:6px 14px;border-radius:99px;font-size:12px;font-weight:600}
.hpill.green{background:var(--green-l);color:#2d6a4f}
.hpill.yellow{background:var(--yellow-l);color:#7d5a00}
.hpill.red{background:var(--red-l);color:var(--red)}
.hdot{width:8px;height:8px;border-radius:50%;background:currentColor}

/* CONTEXT MENU */
#cmenu{display:none;position:fixed;z-index:9000;background:#fff;border:1px solid var(--g200);border-radius:6px;box-shadow:0 8px 24px rgba(0,0,0,.12);padding:4px 0;min-width:160px}
#cmenu.on{display:block}
.cmi{padding:8px 16px;font-size:13px;color:var(--g800);cursor:pointer;display:flex;align-items:center;gap:8px}
.cmi:hover{background:var(--deep)}
.cmi.danger{color:var(--red)}
.cms{border-top:1px solid var(--g200);margin:4px 0}

/* ANNUAL */
.awrap{flex:1;overflow-y:auto;padding:24px;background:var(--ivory)}
.ahead h2{font-family:var(--fd);font-size:30px;font-weight:300;margin-bottom:4px}
.ahead p{font-size:13px;color:var(--g400);margin-bottom:24px}
.ypills{display:flex;gap:6px;margin-bottom:24px;flex-wrap:wrap}
.ypill{padding:5px 14px;border:1.5px solid var(--g200);border-radius:99px;background:transparent;font-family:var(--fb);font-size:12px;font-weight:500;color:var(--g600);cursor:pointer;transition:all var(--t)}
.ypill:hover{border-color:var(--blue);color:var(--blue-d)}
.ypill.on{background:var(--blue-d);border-color:var(--blue-d);color:#fff}
.kpis{display:grid;grid-template-columns:repeat(3,1fr);gap:16px;margin-bottom:24px}
.kpi{background:var(--card);border:1px solid var(--g200);border-radius:10px;padding:20px 22px;position:relative;overflow:hidden}
.kpi::after{content:'';position:absolute;top:0;left:0;right:0;height:3px}
.kpi.inc::after{background:var(--green)}.kpi.exp::after{background:var(--red)}.kpi.net::after{background:var(--blue)}
.kpi-l{font-size:10px;font-weight:600;letter-spacing:.12em;text-transform:uppercase;color:var(--g400);margin-bottom:8px}
.kpi-v{font-family:var(--fd);font-size:28px;font-weight:300}
.kpi-s{font-size:12px;color:var(--g400);margin-top:4px}
.cgrid{display:grid;grid-template-columns:2fr 1fr;gap:20px;margin-bottom:20px}
.ccard{background:var(--card);border:1px solid var(--g200);border-radius:10px;padding:20px}
.ccard h3{font-family:var(--fd);font-size:17px;font-weight:400;margin-bottom:16px}
.ccard canvas{max-height:260px}
.cons{background:var(--g800);color:var(--ivory);border-radius:16px;padding:30px;margin-top:4px}
.cons h2{font-family:var(--fd);font-size:26px;font-weight:300;margin-bottom:6px}
.cons .csub{font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--g400);margin-bottom:24px}
.cins{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:12px;margin-bottom:24px}
.cin{padding:14px 16px;background:rgba(255,255,255,.05);border:1px solid rgba(255,255,255,.08);border-radius:10px}
.cin-l{font-size:10px;font-weight:600;letter-spacing:.12em;text-transform:uppercase;color:var(--blue-m);margin-bottom:4px}
.cin-v{font-family:var(--fd);font-size:20px;font-weight:300;color:#fff}
.cin-d{font-size:11px;color:rgba(255,255,255,.45);margin-top:2px}
.cadvs{display:flex;flex-direction:column;gap:8px}
.cadv{padding:11px 15px;background:rgba(255,255,255,.04);border-left:3px solid var(--blue);border-radius:0 6px 6px 0;font-size:13px;color:rgba(255,255,255,.75);line-height:1.55}
@media(max-width:700px){.kpis{grid-template-columns:1fr}.cgrid{grid-template-columns:1fr}.sidebar{width:44px}.stab span{display:none}}
</style>
</head>
<body>

<div id="toasts"></div>
<div id="cmenu">
  <div class="cmi" onclick="cact('ins-above')">⬆ Insertar fila arriba</div>
  <div class="cmi" onclick="cact('ins-below')">⬇ Insertar fila abajo</div>
  <div class="cms"></div>
  <div class="cmi danger" onclick="cact('del')">🗑 Eliminar fila</div>
</div>

<!-- ═══════ LOGIN ═══════ -->
<div id="pg-login">
  <div class="lbox">
    <div class="lbrand">Michell</div>
    <div class="lsub">Personal Finance · Private</div>
    <div class="lerr" id="lerr"></div>
    <div class="lf">
      <label>Usuario</label>
      <input type="text" id="lu" autocomplete="username" placeholder="Ingresa tu usuario"/>
    </div>
    <div class="lf">
      <label>Contraseña</label>
      <input type="password" id="lp" autocomplete="current-password" placeholder="Ingresa tu contraseña"/>
    </div>
    <button class="lbtn" id="lbtn">Acceder</button>
  </div>
</div>

<!-- ═══════ APP ═══════ -->
<div id="pg-app">

  <div class="topbar">
    <div class="tb-icon">
      <svg viewBox="0 0 24 24" fill="none">
        <rect x="3" y="3" width="18" height="18" rx="2" fill="white" fill-opacity=".9"/>
        <rect x="6" y="8" width="12" height="1.5" fill="#34a853"/>
        <rect x="6" y="11" width="12" height="1.5" fill="#34a853"/>
        <rect x="6" y="14" width="8" height="1.5" fill="#34a853"/>
        <rect x="10" y="6" width="1.5" height="12" fill="#34a853" fill-opacity=".3"/>
      </svg>
    </div>
    <span class="tb-title">Michell Finance</span>
    <div class="tb-gap"></div>
    <div class="sync-pill" id="spill"><span class="sync-dot"></span>Sheets conectado</div>
    <span class="tb-user" id="tbu"></span>
    <button class="btn-out" id="btnout">Salir</button>
  </div>

  <div class="menubar">
    <button class="mtab on" id="mt-ledger"      onclick="goTab('ledger')">📒 Ledger</button>
    <button class="mtab"    id="mt-investments" onclick="goTab('investments')">📈 Inversiones</button>
    <button class="mtab"    id="mt-annual"      onclick="goTab('annual')">📊 Anual</button>
  </div>

  <div class="fbar">
    <input class="fbar-ref" id="fref" value="A1" readonly/>
    <div class="fbar-sep"></div>
    <span class="fbar-fx">fx</span>
    <input class="fbar-val" id="fval" placeholder="Selecciona una celda..." readonly/>
  </div>

  <div class="sstrip">
    <label>Google Sheets CSV</label>
    <input type="url" id="surl" placeholder="https://docs.google.com/spreadsheets/d/…/pub?output=csv"/>
    <button class="btn-sync" id="bsync">
      <span id="sicon">↻</span>
      <span id="stxt">Sincronizar</span>
    </button>
    <button class="btn-sdis" onclick="clearSync()">Desconectar</button>
    <span class="sstatus" id="sstat"></span>
  </div>

  <div class="abody">
    <div class="sidebar">
      <button class="stab on" id="st-ledger"      onclick="goTab('ledger')"><span>📒</span><span>Ledger</span></button>
      <button class="stab"    id="st-investments" onclick="goTab('investments')"><span>📈</span><span>Inversiones</span></button>
      <button class="stab"    id="st-annual"      onclick="goTab('annual')"><span>📊</span><span>Anual</span></button>
    </div>

    <!-- LEDGER -->
    <div class="panel on" id="pn-ledger">
      <div class="mstrip" id="ms-ledger"></div>
      <div class="gwrap">
        <table class="sgt">
          <thead><tr>
            <th class="rnh">#</th>
            <th style="width:110px">Fecha</th>
            <th style="width:230px">Descripción</th>
            <th style="width:130px">Categoría</th>
            <th style="width:90px">Tipo</th>
            <th style="width:140px">Monto (COP)</th>
          </tr></thead>
          <tbody id="ltbody"></tbody>
        </table>
      </div>
      <div class="sumbar" id="lsum"></div>
    </div>

    <!-- INVESTMENTS -->
    <div class="panel" id="pn-investments">
      <div class="mstrip" id="ms-inv"></div>
      <div class="gwrap">
        <table class="sgt">
          <thead><tr>
            <th class="rnh">#</th>
            <th style="width:110px">Fecha</th>
            <th style="width:190px">Activo</th>
            <th style="width:120px">Tipo</th>
            <th style="width:130px">Capital</th>
            <th style="width:130px">Valor Actual</th>
            <th style="width:120px">Ganancia</th>
            <th style="width:90px">ROI %</th>
          </tr></thead>
          <tbody id="itbody"></tbody>
        </table>
      </div>
      <div class="sumbar" id="isum"></div>
    </div>

    <!-- ANNUAL -->
    <div class="panel" id="pn-annual">
      <div class="awrap" id="awrap"></div>
    </div>
  </div>
</div>

<script>
/* =============================================================
   MICHELL FINANCE v4 — clean rewrite
   Login: direct comparison, works in file:// http:// https://
   Data: localStorage, compatible with Google Sheets CSV sync
============================================================= */

/* ── CREDENTIALS ─────────────────────────────────────────────
   Stored as two Base64 tokens. Not plaintext, not visible to
   a casual reader. To change: btoa("newval") in console.
──────────────────────────────────────────────────────────── */
var CU = atob("bWljaGVsbHBm");
var CP = atob("MzM2MDA3Ng==");

/* ── CONSTANTS ─────────────────────────────────────────────── */
var MONTHS = ["Ene","Feb","Mar","Abr","May","Jun","Jul","Ago","Sep","Oct","Nov","Dic"];
var MFULL  = ["Enero","Febrero","Marzo","Abril","Mayo","Junio","Julio","Agosto","Septiembre","Octubre","Noviembre","Diciembre"];
var CATS   = ["Income","Food","Housing","Transport","Health","Entertainment","Savings","Other"];
var ITYPES = ["Stocks","ETF","Crypto","Real Estate","Bonds","Business","Other"];
var LSK    = "mf4_data";
var LSSESS = "mf4_sess";
var LSURL  = "mf4_url";
var LSTIME = "mf4_sync";

/* ── UTILS ──────────────────────────────────────────────────── */
function cop(n){
  return new Intl.NumberFormat("es-CO",{style:"currency",currency:"COP",minimumFractionDigits:0,maximumFractionDigits:0}).format(parseFloat(n)||0);
}
function uid(){ return Math.random().toString(36).slice(2,9); }
function tod(){ return new Date().toISOString().slice(0,10); }
function el(id){ return document.getElementById(id); }

/* ── STATE ──────────────────────────────────────────────────── */
var LY = new Date().getFullYear();
var LM = new Date().getMonth();
var IY = LY, IM = LM;
var AY = LY;
var CTX = null;
var CHARTS = {};

/* ── DB ─────────────────────────────────────────────────────── */
var DB = {
  load: function(){
    try{ return JSON.parse(localStorage.getItem(LSK))||{l:{},i:{}}; }
    catch(e){ return {l:{},i:{}}; }
  },
  save: function(d){ localStorage.setItem(LSK,JSON.stringify(d)); },
  gl: function(y,m){
    var d=this.load(),k=y+"-"+m;
    if(!d.l[k]) d.l[k]={base:0,rows:[]};
    return d.l[k];
  },
  sl: function(y,m,v){
    var d=this.load();
    d.l[y+"-"+m]=v;
    this.save(d);
  },
  gi: function(y,m){
    var d=this.load(),k=y+"-"+m;
    if(!d.i[k]) d.i[k]=[];
    return d.i[k];
  },
  si: function(y,m,v){
    var d=this.load();
    d.i[y+"-"+m]=v;
    this.save(d);
  },
  yearL: function(y){
    var d=this.load(),out=[];
    for(var i=0;i<12;i++) out.push(d.l[y+"-"+i]||{base:0,rows:[]});
    return out;
  },
  yearI: function(y){
    var d=this.load(),out=[];
    for(var i=0;i<12;i++) out.push(d.i[y+"-"+i]||[]);
    return out;
  }
};

/* ── TOAST ──────────────────────────────────────────────────── */
function toast(msg,type){
  var c=el("toasts"),t=document.createElement("div");
  t.className="toast "+(type||"");
  t.textContent=msg;
  c.appendChild(t);
  setTimeout(function(){t.remove();},4000);
}

/* ══════════════════════════════════════════════════════════════
   AUTH — simple, synchronous, no external dependencies
══════════════════════════════════════════════════════════════ */
function initLogin(){
  el("lbtn").onclick = tryLogin;
  el("lp").onkeydown = function(e){ if(e.key==="Enter") tryLogin(); };
  /* Restore session */
  if(localStorage.getItem(LSSESS)==="1") enterApp();
}

function tryLogin(){
  var u = el("lu").value.trim();
  var p = el("lp").value.trim();
  var e = el("lerr");

  if(!u || !p){
    e.textContent="Ingresa usuario y contraseña.";
    e.style.display="block";
    return;
  }

  if(u===CU && p===CP){
    e.style.display="none";
    localStorage.setItem(LSSESS,"1");
    enterApp();
  } else {
    e.textContent="Usuario o contraseña incorrectos.";
    e.style.display="block";
    el("lp").value="";
    el("lp").focus();
  }
}

function enterApp(){
  el("pg-login").style.display="none";
  el("pg-app").style.display="block";
  el("tbu").textContent="michell";
  startApp();
}

function doLogout(){
  localStorage.setItem(LSSESS,"0");
  el("pg-app").style.display="none";
  el("pg-login").style.display="flex";
  el("lu").value="";
  el("lp").value="";
}

══════════════════════════════════════════════════════════════ */
function goTab(id){
  ["ledger","investments","annual"].forEach(function(x){
    el("mt-"+x).classList.toggle("on",x===id);
    el("st-"+x).classList.toggle("on",x===id);
    el("pn-"+x).classList.toggle("on",x===id);
  });
  if(id==="ledger")      renderL();
  if(id==="investments") renderI();
  if(id==="annual")      renderA();
}

/* ── MONTH STRIP ────────────────────────────────────────────── */
function buildStrip(cid, year, month, ychg, mchg){
  var c=el(cid), html="";
  var yrs=[]; for(var y=year+2;y>=2020;y--) yrs.push(y);
  html += "<select class='yr-sel' onchange='"+ychg+"(parseInt(this.value))'>";
  yrs.forEach(function(y){ html+="<option value='"+y+"'"+(y===year?" selected":"")+">"+y+"</option>"; });
  html += "</select>";
  MONTHS.forEach(function(m,i){
    html+="<button class='mbtn"+(i===month?" on":"")+"' onclick='"+mchg+"("+i+")'>"+m+"</button>";
  });
  c.innerHTML=html;
}

/* ── FORMULA BAR ────────────────────────────────────────────── */

  el("fref").value=ref||"";
  el("fval").value=val||"";

/* ── CONTEXT MENU ───────────────────────────────────────────── */
document.addEventListener("click",function(){ el("cmenu").classList.remove("on"); });

function showCM(e,sheet,ri){
  e.preventDefault();
  CTX={sheet:sheet,ri:ri};
  var m=el("cmenu");
  m.style.left=e.clientX+"px";
  m.style.top=e.clientY+"px";
  m.classList.add("on");
}

function cact(action){
  if(!CTX) return;
  var sh=CTX.sheet, ri=CTX.ri;
  if(sh==="l"){
    var d=DB.gl(LY,LM);
    if(action==="del"){ d.rows.splice(ri,1); DB.sl(LY,LM,d); renderL(); }
    else if(action==="ins-above"){ d.rows.splice(ri,0,newLRow()); DB.sl(LY,LM,d); renderL(); }
    else if(action==="ins-below"){ d.rows.splice(ri+1,0,newLRow()); DB.sl(LY,LM,d); renderL(); }
  } else {
    var d=DB.gi(IY,IM);
    if(action==="del"){ d.splice(ri,1); DB.si(IY,IM,d); renderI(); }
    else if(action==="ins-above"){ d.splice(ri,0,newIRow()); DB.si(IY,IM,d); renderI(); }
    else if(action==="ins-below"){ d.splice(ri+1,0,newIRow()); DB.si(IY,IM,d); renderI(); }
  }
}

function newLRow(){ return {id:uid(),date:tod(),desc:"",cat:"Other",type:"expense",amount:0,src:"manual"}; }
function newIRow(){ return {id:uid(),date:tod(),asset:"",type:"ETF",capital:0,cv:0,src:"manual"}; }

/* ── CELL INPUT FACTORY ─────────────────────────────────────── */
function mkCell(val, opts){
  opts = opts||{};
  var inp=document.createElement("input");
  inp.type="text";
  inp.className="ci";
  inp.value=val!=null?val:"";
  if(opts.ph)   inp.placeholder=opts.ph;
  if(opts.al)   inp.style.textAlign=opts.al;
  if(opts.ro){  inp.readOnly=true; inp.style.color="var(--g400)"; inp.style.background="transparent"; }
  if(opts.fw)   inp.style.fontWeight=opts.fw;
  if(opts.col)  inp.style.color=opts.col;
  if(opts.list) inp.setAttribute("list",opts.list);

  inp.onfocus=function(){
    var td=inp.closest("td"), tr=td&&td.closest("tr"), tb=tr&&tr.closest("tbody");
    if(td&&tr&&tb){
      var ci=Array.from(tr.children).indexOf(td);
      var ri=Array.from(tb.children).indexOf(tr)+2;
      var cl="ABCDEFGH"[ci-1]||String(ci);
      setFBar(cl+ri, inp.value);
    }
  };
  inp.oninput=function(){ setFBar(el("fref").value, inp.value); };

  if(opts.onch){
    inp.onblur=function(){ opts.onch(inp.value); };
  }

  inp.onkeydown=function(e){
    if(e.key==="Tab"){
      e.preventDefault();
      var n=adjCell(inp,e.shiftKey?"left":"right");
      if(n) n.focus();
    } else if(e.key==="Enter"){
      e.preventDefault();
      if(opts.onch) opts.onch(inp.value);
      if(opts.onenter) opts.onenter();
      else { var n=adjCell(inp,"down"); if(n) n.focus(); }
    } else if(e.key==="ArrowUp"){ var n=adjCell(inp,"up"); if(n){e.preventDefault();n.focus();} }
    else if(e.key==="ArrowDown"){ var n=adjCell(inp,"down"); if(n){e.preventDefault();n.focus();} }
    else if(e.key==="Escape"){ inp.blur(); }
  };
  return inp;
}

function adjCell(inp,dir){
  var td=inp.closest("td"), tr=td&&td.closest("tr"), tb=tr&&tr.closest("tbody");
  if(!td||!tr||!tb) return null;
  var tds=Array.from(tr.children), trs=Array.from(tb.children);
  var ci=tds.indexOf(td), ri=trs.indexOf(tr), ntd;
  if(dir==="right") ntd=tds[ci+1];
  else if(dir==="left") ntd=tds[ci-1];
  else if(dir==="down"){ var ntr=trs[ri+1]; ntd=ntr&&ntr.children[ci]; }
  else if(dir==="up"){   var ptr=trs[ri-1]; ntd=ptr&&ptr.children[ci]; }
  return ntd&&ntd.querySelector(".ci");
}

/* ── DATALISTS ──────────────────────────────────────────────── */
function ensureDL(){
  if(el("dl-cat")) return;
  var dc=document.createElement("datalist"); dc.id="dl-cat";
  CATS.forEach(function(c){ var o=document.createElement("option"); o.value=c; dc.appendChild(o); });
  document.body.appendChild(dc);

  var dt=document.createElement("datalist"); dt.id="dl-type";
  ["income","expense"].forEach(function(c){ var o=document.createElement("option"); o.value=c; dt.appendChild(o); });
  document.body.appendChild(dt);

  var di=document.createElement("datalist"); di.id="dl-itype";
  ITYPES.forEach(function(c){ var o=document.createElement("option"); o.value=c; di.appendChild(o); });
  document.body.appendChild(di);
}

/* ══════════════════════════════════════════════════════════════
   MODULE 1 — LEDGER
══════════════════════════════════════════════════════════════ */
function setLY(y){ LY=y; buildStrip("ms-ledger",LY,LM,"setLY","setLM"); renderL(); }
function setLM(m){ LM=m; buildStrip("ms-ledger",LY,LM,"setLY","setLM"); renderL(); }

function renderL(){
  ensureDL();
  buildStrip("ms-ledger",LY,LM,"setLY","setLM");
  var data=DB.gl(LY,LM);
  var tb=el("ltbody");
  tb.innerHTML="";

  data.rows.forEach(function(row,ri){
    tb.appendChild(makeLRow(row,ri,data));
  });

  /* Phantom row */
  var ph=document.createElement("tr"); ph.className="ph";
  var pRn=document.createElement("td"); pRn.className="rn"; pRn.textContent=data.rows.length+2; ph.appendChild(pRn);
  var pCols=["","Nueva fila — escribe aquí...","","","",""];
  pCols.forEach(function(ph2,ci){
    var td=document.createElement("td");
    if(ci===0){
      var inp=mkCell("",{ph:"YYYY-MM-DD",onenter:function(){ addLRow(); }});
      inp.onfocus=function(){ if(!inp.value) inp.value=tod(); };
      inp.onblur=function(){ if(inp.value.trim()) addLRow(); };
      td.appendChild(inp);
    } else {
      var inp=document.createElement("input");
      inp.className="ci"; inp.readOnly=true; inp.placeholder=ph2;
      td.appendChild(inp);
    }
    ph.appendChild(td);
  });
  tb.appendChild(ph);

  renderLSum(data);
}

function makeLRow(row,ri,data){
  var tr=document.createElement("tr");
  tr.className=row.type==="income"?"ri":(row.cat==="Savings"?"rs":"re");

  var rn=document.createElement("td"); rn.className="rn"; rn.textContent=ri+2;
  if(row.src==="sheets") rn.style.background="#E6F4EA";
  tr.appendChild(rn);

  function save(){ DB.sl(LY,LM,data); renderL(); }

  var cols=[
    {val:row.date||"",    ph:"YYYY-MM-DD",      onch:function(v){row.date=v;save();}},
    {val:row.desc||"",    ph:"Descripción...",   onch:function(v){row.desc=v;save();},al:"left"},
    {val:row.cat||"Other",ph:"Categoría",        onch:function(v){row.cat=v;save();},list:"dl-cat"},
    {val:row.type||"expense",ph:"tipo",          onch:function(v){row.type=v.toLowerCase();save();},list:"dl-type",al:"center",fw:"600",col:row.type==="income"?"var(--green)":"var(--red)"},
    {val:row.amount||"",  ph:"0",                onch:function(v){row.amount=parseFloat(v.replace(/[^0-9.-]/g,""))||0;save();},al:"right",col:row.type==="income"?"var(--green)":"var(--red)"}
  ];

  cols.forEach(function(c){
    var td=document.createElement("td");
    td.appendChild(mkCell(c.val,{ph:c.ph,onch:c.onch,al:c.al,fw:c.fw,col:c.col,list:c.list}));
    tr.appendChild(td);
  });

  tr.oncontextmenu=function(e){ showCM(e,"l",ri); };
  return tr;
}

function addLRow(){
  var data=DB.gl(LY,LM);
  data.rows.push(newLRow());
  DB.sl(LY,LM,data);
  renderL();
  /* Focus desc of new row */
  setTimeout(function(){
    var rows=el("ltbody").querySelectorAll("tr:not(.ph)");
    var last=rows[rows.length-1];
    if(last){ var ins=last.querySelectorAll(".ci"); if(ins[1]) ins[1].focus(); }
  },50);
}

function renderLSum(data){
  var inc=data.base||0, exp=0;
  data.rows.forEach(function(r){ if(r.type==="income") inc+=r.amount; else exp+=r.amount; });
  var net=inc-exp, pct=inc>0?(exp/inc)*100:0;
  var hc=pct<=50?"green":pct<=80?"yellow":"red";
  var hi=pct<=50?"🟢":pct<=80?"🟡":"🔴";
  var ht=pct<=50?"Excelente":pct<=80?"Controlado":"Déficit";
  var syn=data.rows.filter(function(r){return r.src==="sheets";}).length;
  el("lsum").innerHTML=
    "<div><div class='si-lbl'>Ingresos</div><div class='si-val pos'>"+cop(inc)+"</div></div>"+
    "<div><div class='si-lbl'>Gastos</div><div class='si-val neg'>"+cop(exp)+"</div></div>"+
    "<div><div class='si-lbl'>Balance</div><div class='si-val "+(net>=0?"pos":"neg")+"'>"+cop(net)+"</div></div>"+
    "<div><div class='si-lbl'>Filas</div><div class='si-val'>"+data.rows.length+(syn?" <small style='color:var(--shg)'>("+syn+" Sheets)</small>":"")+"</div></div>"+
    "<div class='hpill "+hc+"' style='margin-left:auto'><span class='hdot'></span>"+hi+" "+ht+" · "+pct.toFixed(1)+"%</div>";
}

/* ══════════════════════════════════════════════════════════════
   MODULE 2 — INVESTMENTS
══════════════════════════════════════════════════════════════ */
function setIY(y){ IY=y; buildStrip("ms-inv",IY,IM,"setIY","setIM"); renderI(); }
function setIM(m){ IM=m; buildStrip("ms-inv",IY,IM,"setIY","setIM"); renderI(); }

function renderI(){
  ensureDL();
  buildStrip("ms-inv",IY,IM,"setIY","setIM");
  var data=DB.gi(IY,IM);
  var tb=el("itbody"); tb.innerHTML="";
  data.forEach(function(row,ri){ tb.appendChild(makeIRow(row,ri,data)); });

  /* Phantom */
  var ph=document.createElement("tr"); ph.className="ph";
  var pRn=document.createElement("td"); pRn.className="rn"; pRn.textContent=data.length+2; ph.appendChild(pRn);
  for(var i=0;i<7;i++){
    var td=document.createElement("td");
    var inp=document.createElement("input"); inp.className="ci"; inp.readOnly=true;
    if(i===0){ inp.readOnly=false; inp.placeholder="YYYY-MM-DD"; inp.onfocus=function(){if(!inp.value)inp.value=tod();}; inp.onblur=function(){if(inp.value.trim())addIRow();}; }
    else inp.placeholder=i===1?"Nueva inversión — escribe aquí...":"";
    td.appendChild(inp); ph.appendChild(td);
  }
  tb.appendChild(ph);
  renderISum(data);
}

function makeIRow(row,ri,data){
  var tr=document.createElement("tr");
  var rn=document.createElement("td"); rn.className="rn"; rn.textContent=ri+2;
  if(row.src==="sheets") rn.style.background="#E6F4EA";
  tr.appendChild(rn);

  function save(){ DB.si(IY,IM,data); renderI(); }

  var profit=(row.cv||0)-(row.capital||0);
  var roi=row.capital>0?(profit/row.capital)*100:0;

  /* Editable columns */
  [
    {val:row.date||"",    ph:"YYYY-MM-DD",   onch:function(v){row.date=v;save();}},
    {val:row.asset||"",   ph:"Activo...",    onch:function(v){row.asset=v;save();}},
    {val:row.type||"ETF", ph:"Tipo",         onch:function(v){row.type=v;save();},list:"dl-itype"},
    {val:row.capital||"", ph:"0",            onch:function(v){row.capital=parseFloat(v.replace(/[^0-9.-]/g,""))||0;save();},al:"right"},
    {val:row.cv||"",      ph:"0",            onch:function(v){row.cv=parseFloat(v.replace(/[^0-9.-]/g,""))||0;save();},al:"right"}
  ].forEach(function(c){
    var td=document.createElement("td");
    td.appendChild(mkCell(c.val,{ph:c.ph,onch:c.onch,al:c.al,list:c.list}));
    tr.appendChild(td);
  });

  /* Computed: Ganancia */
  var tdp=document.createElement("td");
  var ip=mkCell(profit!==0?cop(profit):"",{ro:true,al:"right",col:profit>=0?"var(--green)":"var(--red)",fw:"500"});
  tdp.appendChild(ip); tr.appendChild(tdp);

  /* Computed: ROI */
  var tdr=document.createElement("td");
  var ir=mkCell(row.capital>0?(roi.toFixed(2)+"%"):"",{ro:true,al:"right",col:roi>=0?"var(--green)":"var(--red)",fw:"600"});
  tdr.appendChild(ir); tr.appendChild(tdr);

  tr.oncontextmenu=function(e){ showCM(e,"i",ri); };
  return tr;
}

function addIRow(){
  var data=DB.gi(IY,IM);
  data.push(newIRow());
  DB.si(IY,IM,data);
  renderI();
  setTimeout(function(){
    var rows=el("itbody").querySelectorAll("tr:not(.ph)");
    var last=rows[rows.length-1];
    if(last){ var ins=last.querySelectorAll(".ci"); if(ins[1]) ins[1].focus(); }
  },50);
}

function renderISum(data){
  var cap=0,cur=0;
  data.forEach(function(r){cap+=r.capital||0;cur+=r.cv||0;});
  var pnl=cur-cap, roi=cap>0?(pnl/cap)*100:0;
  var syn=data.filter(function(r){return r.src==="sheets";}).length;
  el("isum").innerHTML=
    "<div><div class='si-lbl'>Capital</div><div class='si-val'>"+cop(cap)+"</div></div>"+
    "<div><div class='si-lbl'>Valor actual</div><div class='si-val'>"+cop(cur)+"</div></div>"+
    "<div><div class='si-lbl'>P&amp;L</div><div class='si-val "+(pnl>=0?"pos":"neg")+"'>"+(pnl>=0?"+":"")+cop(pnl)+"</div></div>"+
    "<div><div class='si-lbl'>ROI</div><div class='si-val "+(roi>=0?"pos":"neg")+"'>"+(roi>=0?"+":"")+roi.toFixed(2)+"%</div></div>"+
    "<div style='margin-left:auto'><div class='si-lbl'>Posiciones</div><div class='si-val'>"+data.length+(syn?" <small style='color:var(--shg)'>("+syn+")</small>":"")+"</div></div>";
}

/* ══════════════════════════════════════════════════════════════
   MODULE 3 — ANNUAL
══════════════════════════════════════════════════════════════ */
function renderA(){
  var ld=DB.yearL(AY), id=DB.yearI(AY);
  var mInc=[],mExp=[],mSav=[];
  var tInc=0,tExp=0, cats={};

  ld.forEach(function(m,idx){
    var inc=m.base||0, exp=0;
    m.rows.forEach(function(r){
      if(r.type==="income") inc+=r.amount;
      else{ exp+=r.amount; cats[r.cat]=(cats[r.cat]||0)+r.amount; }
    });
    mInc.push(inc); mExp.push(exp); mSav.push(inc-exp);
    tInc+=inc; tExp+=exp;
  });

  var tSav=tInc-tExp, savR=tInc>0?(tSav/tInc)*100:0;
  var allI=[], iCap=0, iCur=0;
  id.forEach(function(m){ m.forEach(function(r){ allI.push(r); iCap+=r.capital||0; iCur+=r.cv||0; }); });
  var iROI=iCap>0?((iCur-iCap)/iCap)*100:0;
  var bestM=MONTHS[mInc.indexOf(Math.max.apply(null,mInc))];
  var worstM=MONTHS[mExp.indexOf(Math.max.apply(null,mExp))];
  var actMos=mInc.filter(function(v){return v>0;}).length||1;

  var years=[AY-2,AY-1,AY,AY+1];
  var pills=years.map(function(y){ return "<button class='ypill"+(y===AY?" on":"")+"' onclick='AY="+y+";renderA()'>"+y+"</button>"; }).join("");
  var sc=savR>=20?"pos":savR>0?"":"neg";

  var insHTML=([
    {l:"Brecha anual",      v:cop(tInc-tExp), d:tInc>=tExp?"Superávit":"Déficit"},
    {l:"Ahorro prom/mes",   v:cop(tSav/actMos),d:actMos+" mes(es) con datos"},
    {l:"ROI portafolio",    v:iCap>0?(iROI.toFixed(2)+"%"):"Sin datos",d:iCap>0?"P&L: "+cop(iCur-iCap):"Registra inversiones"},
    {l:"Proyección +5%",    v:cop(tInc*1.05),  d:"Estimado "+(AY+1)},
    {l:"Mes pico ingresos", v:bestM,           d:"Mayor ingreso"},
    {l:"Mes pico gastos",   v:worstM,          d:"Mayor gasto"}
  ]).map(function(i){ return "<div class='cin'><div class='cin-l'>"+i.l+"</div><div class='cin-v'>"+i.v+"</div><div class='cin-d'>"+i.d+"</div></div>"; }).join("");

  var adv=[];
  if(savR>=30) adv.push("🏆 <strong>Alto rendimiento:</strong> Tasa de ahorro "+savR.toFixed(1)+"%. Asigna el excedente a instrumentos indexados diversificados.");
  else if(savR>=15) adv.push("📈 <strong>En camino:</strong> "+savR.toFixed(1)+"% de ahorro. Aumentar a 25% reduciría significativamente tu horizonte de independencia.");
  else if(savR>0) adv.push("⚡ <strong>Mejora requerida:</strong> Solo "+savR.toFixed(1)+"% ahorrado. Aplica la regla 50/30/20 el mes entrante.");
  else adv.push("🚨 <strong>Crítico:</strong> Ahorro nulo o negativo. Corta los 2 mayores gastos discrecionales en 25% de forma inmediata.");
  var ef=tSav/((tExp/12)||1);
  adv.push("🛡️ <strong>Fondo de emergencia:</strong> Al ritmo actual cubres "+ef.toFixed(1)+" meses. Meta mínima: 6 meses ("+cop(tExp/12*6)+").");
  if(iCap>0) adv.push("📊 <strong>Portafolio:</strong> "+cop(iCap)+" invertido a "+iROI.toFixed(2)+"% ROI. "+(iROI>8?"Superando benchmark típico.":"Diversifica en fondos indexados."));
  else adv.push("💡 <strong>Oportunidad:</strong> Sin inversiones. Deploying 10% de ingresos ("+cop(tInc*0.1)+") en fondos indexados genera retornos compuestos.");
  adv.push("📅 <strong>Meta "+(AY+1)+":</strong> Establece un objetivo de "+cop(tSav*1.2)+" — 20% por encima del ritmo actual.");

  el("awrap").innerHTML=

      "<div class='kpi exp'><div class='kpi-l'>Gastos anuales</div><div class='kpi-v'>"+cop(tExp)+"</div><div class='kpi-s'>Prom. "+cop(tExp/12)+"/mes</div></div>"+

    "</div>"+
    "<div class='cgrid'>"+

      "<div class='ccard'><h3>Distribución de Gastos</h3><canvas id='ch-cat'></canvas></div>"+
    "</div>"+

    "<div class='cons'>"+
      "<h2>Reporte Estratégico Anual</h2>"+

      "<div class='cins'>"+insHTML+"</div>"+
      "<div class='cadvs'>"+adv.map(function(a){return "<div class='cadv'>"+a+"</div>";}).join("")+"</div>"+
    "</div>";

  /* Charts */
  mkChart("ch-cf","bar",{labels:MONTHS,datasets:[
    {label:"Ingresos",data:mInc,backgroundColor:"rgba(79,155,115,.75)",borderRadius:4},
    {label:"Gastos",  data:mExp,backgroundColor:"rgba(192,80,80,.65)", borderRadius:4}
  ]});
  var sc2=Object.entries(cats).sort(function(a,b){return b[1]-a[1];});
  if(sc2.length) mkChart("ch-cat","doughnut",{labels:sc2.map(function(x){return x[0];}),datasets:[{data:sc2.map(function(x){return x[1];}),backgroundColor:["#7BAFD4","#6BAE8E","#D4A843","#C06060","#A0BDD8","#8CC4A8"],borderWidth:2,borderColor:"#FAFAF7"}]},true);

}

function mkChart(id,type,data,isDoughnut){
  var cv=el(id); if(!cv) return;
  if(CHARTS[id]) CHARTS[id].destroy();
  var opts=isDoughnut?{responsive:true,maintainAspectRatio:false,plugins:{legend:{position:"right",labels:{font:{family:"DM Sans",size:11},color:"#6B6560"}},tooltip:{callbacks:{label:function(c){return " "+cop(c.raw);}}}}}:{responsive:true,maintainAspectRatio:false,plugins:{legend:{labels:{font:{family:"DM Sans",size:11},color:"#6B6560"}},tooltip:{callbacks:{label:function(c){return " "+cop(c.raw);}}}},scales:{x:{grid:{display:false},ticks:{font:{family:"DM Sans",size:10},color:"#A09890"}},y:{grid:{color:"rgba(0,0,0,.04)"},ticks:{font:{family:"DM Sans",size:10},color:"#A09890",callback:function(v){return new Intl.NumberFormat("es-CO",{notation:"compact",maximumFractionDigits:1}).format(v);}}}}};
  CHARTS[id]=new Chart(cv.getContext("2d"),{type:type,data:data,options:opts});
}

/* ══════════════════════════════════════════════════════════════
   GOOGLE SHEETS SYNC
══════════════════════════════════════════════════════════════ */
function parseCSV(text){
  var rows=[],row=[],f="",q=false;
  for(var i=0;i<text.length;i++){
    var ch=text[i],nx=text[i+1];
    if(q){if(ch==='"'&&nx==='"'){f+='"';i++;}else if(ch==='"'){q=false;}else f+=ch;}
    else{if(ch==='"'){q=true;}else if(ch===','){row.push(f.trim());f="";}else if(ch==='\n'||(ch==='\r'&&nx==='\n')){if(ch==='\r')i++;row.push(f.trim());f="";if(row.some(function(c){return c;}))rows.push(row);row=[];}else f+=ch;}
  }
  if(f.trim()||row.length){row.push(f.trim());if(row.some(function(c){return c;}))rows.push(row);}
  return rows;
}

function normDate(raw){
  if(!raw) return null;
  var s=raw.toString().trim();
  if(/^\d{4}-\d{2}-\d{2}$/.test(s)) return s;
  var pts=s.split(/[\/-\.]/);
  if(pts.length===3){
    var a=pts[0],b=pts[1],c=pts[2];
    if(c.length===4) return c+"-"+b.padStart(2,"0")+"-"+a.padStart(2,"0");
    if(a.length===4) return a+"-"+b.padStart(2,"0")+"-"+c.padStart(2,"0");
  }
  var d=new Date(s); return isNaN(d)?null:d.toISOString().slice(0,10);
}

function isInvHeaders(h){
  var lh=h.map(function(x){return x.toLowerCase();});
  return lh.some(function(x){return x.includes("capital")||x.includes("asset")||x.includes("activo")||x.includes("currentvalue")||x.includes("current value");});
}

function mergeTx(rows){
  var added=0,skipped=0,bym={};
  rows.forEach(function(r){
    var date=normDate(r[0]); if(!date) return;
    var desc=r[1]||"Importado", cat=r[2]||"Other";
    var type=(r[3]||"expense").toLowerCase();
    type=(type.includes("income")||type.includes("ingreso"))?"income":"expense";
    var amt=parseFloat((r[4]||"0").replace(/[^0-9.-]/g,""));
    if(!amt||amt<=0) return;
    var d=new Date(date+"T12:00:00"), k=d.getFullYear()+"-"+d.getMonth();
    (bym[k]=bym[k]||[]).push({date:date,desc:desc,cat:cat,type:type,amount:amt});
  });
  var db=DB.load();
  Object.keys(bym).forEach(function(k){
    var txs=bym[k], parts=k.split("-"), y=parseInt(parts[0]), m=parseInt(parts[1]);
    if(!db.l[k]) db.l[k]={base:0,rows:[]};
    var ex=db.l[k];
    var fps={};
    ex.rows.forEach(function(r){ fps[r.date+"|"+(r.desc||"").toLowerCase()+"|"+r.amount]=1; });
    var baseRow=txs.find(function(t){return t.type==="income"&&t.desc.toLowerCase().includes("base");});
    if(baseRow&&!ex.base) ex.base=baseRow.amount;
    txs.forEach(function(tx){
      var fp=tx.date+"|"+tx.desc.toLowerCase()+"|"+tx.amount;
      if(fps[fp]){skipped++;return;}
      ex.rows.push({id:uid(),src:"sheets",date:tx.date,desc:tx.desc,cat:tx.cat,type:tx.type,amount:tx.amount});
      fps[fp]=1; added++;
    });
    ex.rows.sort(function(a,b){return a.date.localeCompare(b.date);});
  });
  DB.save(db);
  return {added:added,skipped:skipped};
}

function mergeInv(rows){
  var added=0,skipped=0,bym={};
  rows.forEach(function(r){
    var date=normDate(r[0]); if(!date) return;
    var asset=r[1]||"Unknown", type=r[2]||"Other";
    var cap=parseFloat((r[3]||"0").replace(/[^0-9.-]/g,""));
    var cv=parseFloat((r[4]||"0").replace(/[^0-9.-]/g,""))||cap;
    if(!cap||cap<=0) return;
    var d=new Date(date+"T12:00:00"), k=d.getFullYear()+"-"+d.getMonth();
    (bym[k]=bym[k]||[]).push({date:date,asset:asset,type:type,capital:cap,cv:cv});
  });
  var db=DB.load();
  Object.keys(bym).forEach(function(k){
    var invs=bym[k];
    if(!db.i[k]) db.i[k]=[];
    var ex=db.i[k], fps={};
    ex.forEach(function(r){ fps[r.date+"|"+(r.asset||"").toLowerCase()+"|"+r.capital]=1; });
    invs.forEach(function(inv){
      var fp=inv.date+"|"+inv.asset.toLowerCase()+"|"+inv.capital;
      if(fps[fp]){skipped++;return;}
      ex.push({id:uid(),src:"sheets",date:inv.date,asset:inv.asset,type:inv.type,capital:inv.capital,cv:inv.cv});
      fps[fp]=1; added++;
    });
  });
  DB.save(db);
  return {added:added,skipped:skipped};
}

function setSyncBtn(loading){
  var b=el("bsync"),ic=el("sicon"),tx=el("stxt");
  b.disabled=loading;
  if(loading){ ic.className="spinn"; ic.textContent=""; tx.textContent="Sincronizando..."; }
  else { ic.className=""; ic.textContent="↻"; tx.textContent="Sincronizar"; }
}

function setStat(msg,cls){ var e=el("sstat"); e.textContent=msg; e.className="sstatus "+(cls||""); }

function updatePill(){
  var url=localStorage.getItem(LSURL);
  el("spill").classList.toggle("on",!!url);
  var ts=localStorage.getItem(LSTIME);
  if(ts){ var d=new Date(ts); setStat("Sync: "+d.toLocaleDateString("es-CO")+" "+d.toLocaleTimeString("es-CO",{hour:"2-digit",minute:"2-digit"}),"ok"); }
}

function doSync(){
  var url=el("surl").value.trim();
  if(!url){ toast("Ingresa una URL primero.",""); return; }
  if(!url.startsWith("http")){ setStat("URL inválida.","err"); return; }
  localStorage.setItem(LSURL,url);
  setSyncBtn(true); setStat("Conectando...","");
  var proxies=["https://api.allorigins.win/raw?url="+encodeURIComponent(url),"https://corsproxy.io/?"+encodeURIComponent(url)];
  var idx=0;
  function tryNext(){
    if(idx>=proxies.length){ setSyncBtn(false); setStat("Error de red. Verifica que el sheet esté publicado como CSV.","err"); toast("Sync fallido.","err"); return; }
    fetch(proxies[idx++],{cache:"no-cache"}).then(function(r){
      if(!r.ok) throw new Error("HTTP "+r.status);
      return r.text();
    }).then(function(text){
      if(text.trimLeft().charAt(0)==="<"){ setSyncBtn(false); setStat("Recibido HTML. Verifica ?output=csv en la URL.","err"); return; }
      var rows=parseCSV(text);
      if(rows.length<2){ setSyncBtn(false); setStat("Sheet vacío.","err"); return; }
      var headers=rows[0], data=rows.slice(1);
      var result=isInvHeaders(headers)?mergeInv(data):mergeTx(data);
      localStorage.setItem(LSTIME,new Date().toISOString());
      updatePill(); setSyncBtn(false);
      var msg=result.added+" registros importados · "+result.skipped+" duplicados omitidos.";
      setStat(msg,"ok"); toast(msg,"ok");
      renderL(); renderI();
      if(el("pn-annual").classList.contains("on")) renderA();
    }).catch(function(){ tryNext(); });
  }
  tryNext();
}

function clearSync(){
  if(!confirm("¿Desconectar? Los datos importados se conservan.")) return;
  el("surl").value=""; localStorage.removeItem(LSURL); localStorage.removeItem(LSTIME);
  setStat("",""); updatePill(); toast("Desconectado. Datos conservados.","");
}

function autoSync(){
  var url=localStorage.getItem(LSURL);
  if(url){ el("surl").value=url; setTimeout(doSync,900); }
}

/* ══════════════════════════════════════════════════════════════
   BOOTSTRAP

function startApp(){
  updatePill();
  el("btnout").onclick=doLogout;
  el("bsync").onclick=doSync;
  renderL();
  renderI();
  autoSync();
}

window.onload=function(){
  initLogin();
};
